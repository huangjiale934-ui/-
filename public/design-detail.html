<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金详情页表头 · 20 套设计</title>
<style>
  :root { --brand:#0866bb; --brand2:#2f7fc1; --ink:#16283e; --t2:#3d5470; --t3:#8595a8;
          --line:#e3ecf4; --soft:#edf7ff; --up:#d93025; --dn:#12996b; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f7fb; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif; }
  .hd { max-width:1120px; margin:0 auto; padding:34px 20px 8px; }
  .hd h1 { margin:0 0 8px; font-size:24px; }
  .hd p { margin:0; color:#5b6f85; font-size:13.5px; line-height:1.8; }
  .hd b { color:var(--brand); }
  .list { max-width:1120px; margin:0 auto; padding:16px 20px 70px; display:flex; flex-direction:column; gap:18px; }
  .cell { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 4px 18px rgba(20,50,90,.06); }
  .cap { display:flex; align-items:baseline; gap:9px; padding:10px 14px; border-bottom:1px solid #eef3f9; background:#fbfdff; }
  .cap b { font-size:13px; color:var(--brand); letter-spacing:.4px; }
  .cap span { font-size:12.5px; color:#63798f; }
  .demo { padding:14px; background:#fff; }

  /* ===== 共用零件 ===== */
  .mh { width:1000px; transform-origin: top left; }
  .wrap { width:1000px; }
  .k { font-size:11px; color:var(--t3); letter-spacing:.02em; }
  .v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
  .vs { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .s { font-size:10.5px; color:var(--t3); }
  .tag { display:inline-block; font-size:10px; padding:1.5px 7px; border-radius:4px; background:var(--soft); color:var(--brand); }
  .stars { font-size:10px; color:#e8a33d; letter-spacing:1px; }
  .up { color:var(--up); } .dn { color:var(--dn); }

  /* D01 现状 */
  .d01 { display:grid; grid-template-columns:1.25fr 1fr 1fr 1fr 1fr; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .d01 .p { background:#f5f9fe; padding:12px 16px; border-right:1px solid var(--line); }
  .d01 .c { padding:12px 14px; border-right:1px solid #eef3f9; }
  .d01 .c:last-child { border-right:0; }
  .d01 .v { font-size:30px; }

  /* D02 白底 + 左蓝条 */
  .d02 { display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr 1fr; border:1px solid var(--line); border-radius:10px; }
  .d02 .p { padding:12px 16px 12px 18px; border-left:3px solid var(--brand); border-right:1px solid #eef3f9; }
  .d02 .c { padding:12px 14px; border-right:1px solid #eef3f9; }
  .d02 .c:last-child { border-right:0; }

  /* D03 无底色 5 等分 */
  .d03 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .d03 > div { padding:11px 12px; }
  .d03 .p { padding-left:2px; }

  /* D04 价格 + 4 个浅灰方块 */
  .d04 { display:flex; gap:10px; align-items:stretch; }
  .d04 .p { flex:1.4; padding:14px 16px; border-radius:10px; background:linear-gradient(135deg,#0b5ea8,#2f7fc1); color:#fff; }
  .d04 .p .k, .d04 .p .s { color:#cfe4f7; }
  .d04 .g { flex:3; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .d04 .b { background:#f7fafd; border:1px solid #eef3f9; border-radius:9px; padding:12px; }

  /* D05 价格 + 右侧 2×2 */
  .d05 { display:flex; gap:14px; align-items:stretch; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .d05 .p { flex:0 0 250px; padding:14px 16px; background:#f5f9fe; }
  .d05 .g { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#eef3f9; }
  .d05 .b { background:#fff; padding:11px 14px; }

  /* D06 全 inline */
  .d06 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; align-items:end;
          padding:10px 0 12px; border-bottom:1px solid var(--line); }
  .d06 > div { padding:0 16px; border-right:1px solid #eef3f9; }
  .d06 > div:last-child { border-right:0; }
  .d06 .v { font-size:18px; } .d06 .p .v { font-size:34px; }

  /* D07 胶囊 */
  .d07 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:76px; }
  .d07 .p { flex:0 0 240px; }
  .d07 .cap2 { align-self:center; }
  .d07 .p { margin-right:6px; }
  .d07 .cap2 { border:1px solid #dbe9f6; background:#f7fbff; border-radius:999px; padding:7px 14px; display:flex; gap:8px; align-items:baseline; }
  .d07 .cap2 .k { font-size:10.5px; }
  .d07 .cap2 b { font-size:14.5px; }

  /* D08 横排 label：value */
  .d08 { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .d08 .p { display:flex; align-items:baseline; gap:8px; margin-right:8px; }
  .d08 .p .v { font-size:30px; }
  .d08 .it { display:flex; align-items:baseline; gap:6px; padding-left:18px; border-left:1px solid #eef3f9; }
  .d08 .it b { font-size:14.5px; }

  /* D09 深蓝价格块 */
  .d09 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; border-radius:10px; overflow:hidden; background:#0d4f8b; }
  .d09 .p { padding:13px 16px; color:#fff; }
  .d09 .p .k, .d09 .p .s { color:#bcd8f0; }
  .d09 .c { padding:13px 14px; color:#fff; border-left:1px solid rgba(255,255,255,.14); }
  .d09 .c .k { color:#bcd8f0; }
  .d09 .v { font-size:30px; }

  /* D10 价格居中两行 */
  .d10 { border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .d10 .top2 { display:flex; align-items:baseline; justify-content:center; gap:10px; padding-bottom:9px; }
  .d10 .top2 .v { font-size:32px; }
  .d10 .g { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:#eef3f9; border-top:1px solid #eef3f9; }
  .d10 .b { background:#fff; padding:9px 12px; text-align:center; }

  /* D11 表格式 */
  .d11 { display:flex; gap:16px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .d11 .p { flex:0 0 230px; padding:12px 16px; background:#f5f9fe; }
  .d11 .t { flex:1; display:grid; grid-template-columns:1fr 1fr; }
  .d11 .r { display:flex; justify-content:space-between; align-items:center; padding:7px 14px; border-bottom:1px solid #f2f6fb; }
  .d11 .r:nth-child(odd) { border-right:1px solid #f2f6fb; }

  /* D12 2×3 卡网格 */
  .d12 { display:grid; grid-template-columns:1.3fr 1fr 1fr; grid-template-rows:auto auto; gap:9px; }
  .d12 .p { grid-row:span 2; padding:14px 16px; border-radius:10px; background:#f5f9fe; border:1px solid #dbe9f6; }
  .d12 .b { border:1px solid #eef3f9; border-radius:9px; padding:9px 12px; }

  /* D13 环形 */
  .d13 { display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
  .d13 .p { flex:0 0 220px; }
  .d13 .ring { display:flex; align-items:center; gap:10px; }
  .d13 .g { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:center; }
  .d13 .g .b { padding:0 0 0 14px; border-left:1px solid #eef3f9; }

  /* D14 带图标 */
  .d14 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; border:1px solid var(--line); border-radius:10px; }
  .d14 > div { padding:12px 14px; border-right:1px solid #eef3f9; }
  .d14 > div:last-child { border-right:0; }
  .d14 .ic { width:18px; height:18px; border-radius:5px; background:var(--soft); display:inline-flex;
             align-items:center; justify-content:center; font-size:10px; color:var(--brand); margin-right:5px; }

  /* D15 色条 */
  .d15 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .d15 > div { padding:12px 14px; border-left:3px solid transparent; border-right:1px solid #eef3f9; }
  .d15 > div:last-child { border-right:0; }
  .d15 .p { border-left:3px solid var(--brand); background:#fafcff; }

  /* D16 右对齐 */
  .d16 { display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr 1fr; border:1px solid var(--line); border-radius:10px; }
  .d16 > div { padding:12px 16px; text-align:right; border-right:1px solid #eef3f9; }
  .d16 .p { text-align:left; border-right:1px solid var(--line); }

  /* D17 右侧 2×2 紧凑 */
  .d17 { display:flex; gap:12px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; align-items:center; }
  .d17 .p { flex:0 0 240px; }
  .d17 .m { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; }
  .d17 .i { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed #eef3f9; padding-bottom:3px; }

  /* D18 等宽右对齐 */
  .d18 { display:grid; grid-template-columns:1.2fr repeat(4,1fr); align-items:center; border-bottom:2px solid var(--line); padding-bottom:10px; }
  .d18 > div { text-align:right; }
  .d18 .p { text-align:left; }
  .d18 .p .v { font-size:32px; }

  /* D19 大数值 */
  .d19 { display:flex; align-items:flex-end; gap:26px; padding:12px 0 14px; border-bottom:1px solid var(--line); }
  .d19 .p { flex:0 0 260px; }
  .d19 .p .v { font-size:38px; letter-spacing:-1px; }
  .d19 .g { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .d19 .b b { display:block; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }

  /* D20 价格 + sparkline */
  .d20 { display:grid; grid-template-columns:1.4fr 1.2fr 1fr 1fr 1fr; align-items:center;
          border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .d20 > div { padding:12px 14px; border-right:1px solid #eef3f9; }
  .d20 > div:last-child { border-right:0; }
  .d20 .p { background:#f5f9fe; }
  .d20 .sp { border-right:1px solid #eef3f9; }
</style>
</head>
<body>
<div class="hd">
  <h1>基金详情页表头 · 20 套（把下面 4 块挪到价格右边）</h1>
  <p>每套都是真实 1000px 宽（弹窗内宽度）。目标：<b>一行放下</b>，省掉 2–3 行高度。挑一个编号告诉我（例：「D04」）。</p>
</div>
<div class="list" id="list"></div>

<script>
(function () {
  const p = () => '<div class="p"><div class="k">价格（HKD）</div><div class="s">截至 2026-10-29</div>' +
    '<div class="v">38.7430</div><div class="s">52周波幅 31.26 – 38.74</div></div>';
  const pFlat = () => '<div class="p"><div class="k">价格（HKD）</div><div class="s">截至 2026-10-29</div>' +
    '<div class="v">38.7430</div></div>';
  const type = () => '<div class="b"><div class="k">资产类别</div><div class="vs">股票基金</div><div class="s">未分类股票基金</div></div>';
  const ret = () => '<div class="b"><div class="k">表现（3年回报）</div><div class="vs up">+46.47%</div><div class="stars">★★★☆☆</div></div>';
  const vol = () => '<div class="b"><div class="k">风险指标（3年波幅）</div><div class="vs">13.69%</div><div class="stars">★★★★☆</div></div>';
  const fee = () => '<div class="b"><div class="k">收费（基金开支比率）</div><div class="vs">1.88%</div><div class="stars">★☆☆☆☆</div></div>';
  const sp = '<svg width="118" height="40" viewBox="0 0 118 40"><polyline points="0,30 8,28 16,31 24,24 32,26 40,20 48,23 56,17 64,20 72,13 80,16 88,10 96,13 104,7 112,10 118,5" fill="none" stroke="#0866bb" stroke-width="2"/></svg>';

  const V = [];
  V.push(['D01', '现状：价格浅蓝块 + 4 块竖线分隔（一行）', '<div class="d01">' + p() + '<div class="c">' + type().replace('b"', 'x"') + '</div><div class="c"><div class="k">表现（3年回报）</div><div class="vs up">+46.47%</div><div class="stars">★★★☆☆</div></div><div class="c"><div class="k">风险指标（3年波幅）</div><div class="vs">13.69%</div><div class="stars">★★★★☆</div></div><div class="c"><div class="k">收费（基金开支比率）</div><div class="vs">1.88%</div><div class="stars">★☆☆☆☆</div></div></div>']);
  V.push(['D02', '白底 + 价格左侧 3px 蓝条（最克制）', '<div class="d02">' + p() + type().replace(/^<div class="b">/, '<div class="c">').replace(/<\/div>$/, '</div>') + ret().replace(/^<div class="b">/, '<div class="c">').replace(/<\/div>$/, '</div>') + vol().replace(/^<div class="b">/, '<div class="c">').replace(/<\/div>$/, '</div>') + fee().replace(/^<div class="b">/, '<div class="c">').replace(/<\/div>$/, '</div>') + '</div>']);
  V.push(['D03', '无底色，5 列等分 + 上下细线', '<div class="d03">' + p() + type() + ret() + vol() + fee() + '</div>']);
  V.push(['D04', '深蓝渐层价格块 + 4 个浅灰方块', '<div class="d04">' + p() + '<div class="g">' + type() + ret() + vol() + fee() + '</div></div>']);
  V.push(['D05', '价格左（250px）+ 右侧 2×2 网格', '<div class="d05">' + p() + '<div class="g">' + type() + ret() + vol() + fee() + '</div></div>']);
  V.push(['D06', '全 inline：标签小字在上、数值大字在下', '<div class="d06">' + p() + type() + ret() + vol() + fee() + '</div>']);
  V.push(['D07', '价格 + 4 个浅蓝胶囊（最轻）', '<div class="d07">' + pFlat() + '<div class="cap2"><span class="k">资产类别</span><b>股票基金</b></div><div class="cap2"><span class="k">3年回报</span><b class="up">+46.47%</b></div><div class="cap2"><span class="k">3年波幅</span><b>13.69%</b></div><div class="cap2"><span class="k">开支比率</span><b>1.88%</b></div></div>']);
  V.push(['D08', '横排「标签：数值」一行到底', '<div class="d08">' + p() + '<div class="it"><span class="k">资产类别</span><b>股票基金</b></div><div class="it"><span class="k">3年回报</span><b class="up">+46.47%</b></div><div class="it"><span class="k">3年波幅</span><b>13.69%</b></div><div class="it"><span class="k">开支比率</span><b>1.88%</b></div></div>']);
  V.push(['D09', '整条深蓝（价格 + 4 项反白）', '<div class="d09">' + p() + '<div class="c">' + type().replace('class="b"', 'class="c"').replace('vs', 'vs') + '</div><div class="c"><div class="k">表现（3年回报）</div><div class="vs up">+46.47%</div><div class="stars">★★★☆☆</div></div><div class="c"><div class="k">风险指标（3年波幅）</div><div class="vs">13.69%</div><div class="stars">★★★★☆</div></div><div class="c"><div class="k">收费（基金开支比率）</div><div class="vs">1.88%</div><div class="stars">★☆☆☆☆</div></div></div>']);
  V.push(['D10', '价格居中一行 + 4 项等分一行（两行但极矮）', '<div class="d10"><div class="top2"><span class="k">价格（HKD）</span><span class="v">38.7430</span><span class="s">截至 2026-10-29 · 52周波幅 31.26 – 38.74</span></div><div class="g"><div class="b"><div class="k">资产类别</div><div class="vs">股票基金</div></div><div class="b"><div class="k">3年回报</div><div class="vs up">+46.47%</div></div><div class="b"><div class="k">3年波幅</div><div class="vs">13.69%</div></div><div class="b"><div class="k">开支比率</div><div class="vs">1.88%</div></div></div></div>']);
  V.push(['D11', '价格左 + 右侧 2×2 键值表（信息最密）', '<div class="d11">' + p() + '<div class="t"><div class="r"><span class="k">资产类别</span><b class="vs">股票基金</b></div><div class="r"><span class="k">表现（3年回报）</span><b class="vs up">+46.47%</b></div><div class="r"><span class="k">风险指标（3年波幅）</span><b class="vs">13.69%</b></div><div class="r"><span class="k">收费（开支比率）</span><b class="vs">1.88%</b></div></div></div>']);
  V.push(['D12', '价格占大卡 + 右侧 4 张小卡（2 行）', '<div class="d12">' + p() + type() + ret() + vol() + fee() + '</div>']);
  V.push(['D13', '价格 + 波幅环形进度 + 3 项', '<div class="d13">' + p() + '<div class="ring"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="#e8f1fb" stroke-width="7"/><circle cx="27" cy="27" r="22" fill="none" stroke="#0866bb" stroke-width="7" stroke-dasharray="137" stroke-dashoffset="96" stroke-linecap="round" transform="rotate(-90 27 27)"/><text x="27" y="31" font-size="11" text-anchor="middle" fill="#16283e" font-weight="700">13.7%</text></svg><div><div class="k">3年波幅</div><div class="s">同类中位 15.2%</div></div></div><div class="g"><div class="b"><div class="k">资产类别</div><div class="vs">股票基金</div></div><div class="b"><div class="k">3年回报</div><div class="vs up">+46.47%</div></div><div class="b"><div class="k">开支比率</div><div class="vs">1.88%</div></div></div></div>']);
  V.push(['D14', '价格 + 4 项带小图标', '<div class="d14">' + p() + '<div><div class="k"><span class="ic">◧</span>资产类别</div><div class="vs">股票基金</div></div><div><div class="k"><span class="ic">↗</span>3年回报</div><div class="vs up">+46.47%</div></div><div><div class="k"><span class="ic">≈</span>3年波幅</div><div class="vs">13.69%</div></div><div><div class="k"><span class="ic">%</span>开支比率</div><div class="vs">1.88%</div></div></div>']);
  V.push(['D15', '价格 + 4 项左侧色条（回报红 / 波幅蓝）', '<div class="d15">' + p() + '<div style="border-left-color:#5b8db8">' + type().replace(/^<div class="b">/, '').replace(/<\/div>$/, '') + '</div><div style="border-left-color:#d93025">' + ret().replace(/^<div class="b">/, '').replace(/<\/div>$/, '') + '</div><div style="border-left-color:#0866bb">' + vol().replace(/^<div class="b">/, '').replace(/<\/div>$/, '') + '</div><div style="border-left-color:#9fb3c6">' + fee().replace(/^<div class="b">/, '').replace(/<\/div>$/, '') + '</div></div>']);
  V.push(['D16', '价格左对齐，4 项数值右对齐', '<div class="d16">' + p() + type() + ret() + vol() + fee() + '</div>']);
  V.push(['D17', '价格 + 右侧 2×2 紧凑键值（虚线分隔）', '<div class="d17">' + p() + '<div class="m"><div class="i"><span class="k">资产类别</span><b class="vs">股票基金</b></div><div class="i"><span class="k">3年回报</span><b class="vs up">+46.47%</b></div><div class="i"><span class="k">3年波幅</span><b class="vs">13.69%</b></div><div class="i"><span class="k">开支比率</span><b class="vs">1.88%</b></div></div></div>']);
