<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f4c81%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图表配色方案 20 套 · 香港强积金数据平台</title>
<style>
  :root { --ink: #14314f; --ink2: #4a5b6e; --ink3: #8598ab; --line: #e3ecf4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef3f8; color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .hd { padding: 28px 32px 18px; background: #fff; border-bottom: 1px solid var(--line); }
  .hd h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: .2px; }
  .hd p { margin: 0; color: var(--ink2); font-size: 13px; }
  .hd .note { margin-top: 10px; padding: 9px 12px; background: #f4f9fe; border-left: 3px solid #0866bb;
    border-radius: 6px; font-size: 12.5px; color: #33556f; }
  .list { padding: 22px 32px 60px; display: flex; flex-direction: column; gap: 18px; max-width: 1260px; margin: 0 auto; }
  .cell { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 18px;
    box-shadow: 0 2px 10px rgba(20, 50, 80, .05); }
  .cell-hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .cell-hd .id { font-size: 12.5px; font-weight: 800; color: #0866bb; letter-spacing: .06em; }
  .cell-hd h2 { margin: 0; font-size: 15.5px; font-weight: 700; }
  .cell-hd .desc { color: var(--ink3); font-size: 12px; }
  .sw { display: flex; gap: 4px; margin: 8px 0 12px; }
  .sw i { width: 26px; height: 12px; border-radius: 3px; display: block; }
  .charts { display: grid; grid-template-columns: 1fr 1fr 1.06fr; gap: 12px; }
  .box { border: 1px solid #edf3f9; border-radius: 10px; padding: 10px 12px 12px; background: #fcfdff; min-width: 0; }
  .box h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--ink3); }
  .flex { display: flex; align-items: center; gap: 12px; }
  .lg { list-style: none; margin: 0; padding: 0; font-size: 11px; color: var(--ink2); min-width: 0; }
  .lg li { display: flex; align-items: center; gap: 5px; padding: 1.5px 0; white-space: nowrap; }
  .lg i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .lg em { font-style: normal; margin-left: auto; padding-left: 8px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .thermo { display: flex; align-items: center; gap: 12px; }
  .th-stats { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--ink2); }
  .th-stats b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .th-bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .th-bar i { display: block; height: 100%; }
  .th-legend { display: flex; gap: 10px; margin-top: 6px; font-size: 10.5px; color: var(--ink3); }
  .th-legend span { display: flex; align-items: center; gap: 4px; }
  .th-legend i { width: 7px; height: 7px; border-radius: 50%; }
</style>
</head>
<body>
<div class="hd">
  <h1>三个图表 · 20 套配色方案</h1>
  <p>作用对象：基金种类分布（环形）、受托人市场份额（饼图）、市场涨跌温度计。真实尺寸、真实数据，编号告诉我即可落地。</p>
  <div class="note">约束：领导要求「网页不要太多颜色」，所以 20 套都以品牌蓝为主轴、绿只作点缀或完全不出现；P09 是线上现状，放在第一张做对照。风险级别分布图不在本次范围（保持蓝色由浅至深）。</div>
</div>
<div class="list" id="list"></div>

<script>
(function () {
  /* 真实数据（与线上一致） */
  const TYPES = [
    ['股票基金', 169, 3.2], ['混合资产基金', 101, 2.1], ['货币市场（保守）', 29, 0.6],
    ['保证基金', 9, 1.4], ['债券基金', 41, 1.8], ['货币市场（非保守）', 12, 0.5],
  ];
  const TRUSTEES = [
    ['HSBC', 28.0], ['宏利', 27.2], ['银联信托', 12.3], ['永明', 11.1], ['友邦信托', 11.0], ['其他 6 家', 10.4],
  ];

  /* 每套：主色板 6 色 + 温度计三段 + 涨跌两色 */
  const P = [
    { id: 'P01', name: '单色蓝 · 六阶', desc: '同一色相拉开明度，最稳、最不像「图表」却最好读', c: ['#0a4d8c', '#19639f', '#2f7cb8', '#4f96cd', '#7cb2dd', '#aacfeb'], th: ['#0a4d8c', '#4f96cd', '#aacfeb'], up: '#0a4d8c', down: '#9fb4c6' },
    { id: 'P02', name: '蓝 · 青', desc: '蓝为主、青为辅，冷色系里的层次感，不刺眼', c: ['#0a4d8c', '#12708f', '#1a8f96', '#3fa7a2', '#79c2b6', '#b3dcd2'], th: ['#0a4d8c', '#1a8f96', '#b3dcd2'], up: '#0a4d8c', down: '#7fb3a6' },
    { id: 'P03', name: '蓝灰 + 一点绿', desc: '整体收灰，只留一支品牌绿做记忆点', c: ['#0b4f8c', '#3f6f9c', '#6f90ae', '#9fb4c6', '#c8d6e2', '#8cc63f'], th: ['#0b4f8c', '#6f90ae', '#8cc63f'], up: '#0b4f8c', down: '#8cc63f' },
    { id: 'P04', name: '深海渐变', desc: '由深海蓝到浅雾蓝的连续渐变，最像专业研报', c: ['#08355e', '#0d4a7a', '#156196', '#2c7fb2', '#57a0c9', '#8cc0dd'], th: ['#08355e', '#2c7fb2', '#8cc0dd'], up: '#08355e', down: '#9db6c8' },
    { id: 'P05', name: '蓝 · 靛紫', desc: '偏冷的高级感，适合金融科技调性', c: ['#123a7a', '#2a4f96', '#4968b3', '#6a86c9', '#95a9dc', '#c2cdea'], th: ['#123a7a', '#4968b3', '#c2cdea'], up: '#123a7a', down: '#a3aec8' },
    { id: 'P06', name: '蓝 · 沙金', desc: '蓝配低饱和金，稳重里带一点贵气（金只做小面积）', c: ['#0b4f8c', '#2f74a8', '#6198c2', '#9dbdd8', '#c9dceb', '#c8a96a'], th: ['#0b4f8c', '#6198c2', '#c8a96a'], up: '#0b4f8c', down: '#c8a96a' },
    { id: 'P07', name: '蓝 · 珊瑚点缀', desc: '主色仍是蓝，只用一支暖色区分「其他/最大」', c: ['#0a4d8c', '#2b76b0', '#5e9dcc', '#94bfe0', '#c2dbef', '#e08a6a'], th: ['#0a4d8c', '#5e9dcc', '#e08a6a'], up: '#0a4d8c', down: '#d98a70' },
    { id: 'P08', name: '莫兰迪灰蓝', desc: '全部降饱和，长时间看不累，适合长表格站', c: ['#4a627d', '#65809a', '#849cb4', '#a6b8c9', '#c8d4df', '#dfe7ee'], th: ['#4a627d', '#849cb4', '#dfe7ee'], up: '#4a627d', down: '#a6b8c9' },
    { id: 'P09', name: '线上现状（蓝 + 浅绿）· 对照', desc: '当前线上配色，放这里方便对比', c: ['#0b5fa5', '#8cc63f', '#2e86c8', '#b5d96b', '#7bbef4', '#d7e9b8'], th: ['#084e8c', '#7bbef4', '#5f9e2f'], up: '#0b5fa5', down: '#8cc63f' },
    { id: 'P10', name: '蓝 · 薄荷', desc: '薄荷绿更淡，只作点缀，不抢蓝', c: ['#0a4d8c', '#2f74a8', '#5f9cc9', '#93bfde', '#bfd9ec', '#9fd8c4'], th: ['#0a4d8c', '#5f9cc9', '#9fd8c4'], up: '#0a4d8c', down: '#9fd8c4' },
    { id: 'P11', name: '单色渐变映射', desc: '按数值大小自动映射同一色相深浅（数据驱动）', c: ['#06325b', '#0e4f80', '#1a6da0', '#3a8cbb', '#6aacd0', '#a5cde4'], th: ['#06325b', '#3a8cbb', '#a5cde4'], up: '#06325b', down: '#b9cbd8' },
    { id: 'P12', name: '靛蓝 · 石板', desc: '靛蓝 + 石板灰，冷硬、克制', c: ['#20396e', '#384f7f', '#566a92', '#7d8da9', '#a8b4c7', '#d2d9e3'], th: ['#20396e', '#566a92', '#d2d9e3'], up: '#20396e', down: '#a8b4c7' },
    { id: 'P13', name: '蓝 · 橄榄', desc: '橄榄绿压得很低，只在末位出现', c: ['#0b4f8c', '#2f74a8', '#6198c2', '#9dbdd8', '#c9dceb', '#a3ab6a'], th: ['#0b4f8c', '#6198c2', '#a3ab6a'], up: '#0b4f8c', down: '#a3ab6a' },
    { id: 'P14', name: '海军蓝 · 雾青', desc: '背景感最强的一组，图表融进页面不跳', c: ['#123a63', '#2b5c85', '#4c7fa5', '#76a1bd', '#a3c2d4', '#cbe0e9'], th: ['#123a63', '#4c7fa5', '#cbe0e9'], up: '#123a63', down: '#a3c2d4' },
    { id: 'P15', name: '蓝 · 暖灰', desc: '用暖灰代替绿，彻底避开「绿色=下跌」的误读', c: ['#0a4d8c', '#35709e', '#6a95b6', '#9db6c8', '#c8d4de', '#ddd5cc'], th: ['#0a4d8c', '#6a95b6', '#ddd5cc'], up: '#0a4d8c', down: '#c2b6a8' },
    { id: 'P16', name: '极简双色', desc: '只有深蓝 + 浅灰蓝两色，靠留白分层', c: ['#0a4d8c', '#c7d9e8', '#0a4d8c', '#c7d9e8', '#0a4d8c', '#c7d9e8'], th: ['#0a4d8c', '#c7d9e8', '#e8eff5'], up: '#0a4d8c', down: '#b9cbd8' },
    { id: 'P17', name: '蓝 · 绿松石（低饱和）', desc: '绿松石代替原来的黄绿，冷调更统一', c: ['#0a4d8c', '#1d7396', '#3c93a6', '#6eb2b8', '#a3cfcb', '#d3e8e2'], th: ['#0a4d8c', '#3c93a6', '#d3e8e2'], up: '#0a4d8c', down: '#6eb2b8' },
    { id: 'P18', name: '冰蓝单色', desc: '整体极浅，适合大屏投影，靠描边区分', c: ['#2f74a8', '#5d97c2', '#8ab5d6', '#b2cfe6', '#d3e5f2', '#eaf4fa'], th: ['#2f74a8', '#8ab5d6', '#eaf4fa'], up: '#2f74a8', down: '#b2cfe6' },
    { id: 'P19', name: '深蓝 · 木色', desc: '木色偏棕，稳重传统，适合年长用户', c: ['#0b3f70', '#2c6491', '#5a8db4', '#93b3cd', '#c5d7e5', '#b99a76'], th: ['#0b3f70', '#5a8db4', '#b99a76'], up: '#0b3f70', down: '#b99a76' },
    { id: 'P20', name: '蓝 · 玫紫（谨慎）', desc: '对比最强的一组，视觉冲击好但离「克制」最远', c: ['#0a4d8c', '#2f6fb0', '#5c93cd', '#8fb8e0', '#bed7ef', '#b06a9a'], th: ['#0a4d8c', '#5c93cd', '#b06a9a'], up: '#0a4d8c', down: '#b06a9a' },
  ];

  const donut = (colors) => {
    const cx = 52, cy = 52, r = 42, r0 = 27;
    const total = TYPES.reduce((a, x) => a + x[1], 0);
    let a0 = -Math.PI / 2, s = '';
    TYPES.forEach((t, i) => {
      const a1 = a0 + (t[1] / total) * Math.PI * 2;
      const p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)];
      const p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
      const q1 = [cx + r0 * Math.cos(a1), cy + r0 * Math.sin(a1)];
      const q0 = [cx + r0 * Math.cos(a0), cy + r0 * Math.sin(a0)];
      s += '<path d="M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) +
        'L' + q1[0].toFixed(1) + ' ' + q1[1].toFixed(1) + 'A' + r0 + ' ' + r0 + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 0 ' + q0[0].toFixed(1) + ' ' + q0[1].toFixed(1) + 'Z" fill="' + colors[i % colors.length] + '"/>';
      a0 = a1;
    });
    return '<svg viewBox="0 0 104 104" width="104" height="104">' + s +
      '<text x="52" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#14314f">451</text>' +
      '<text x="52" y="63" text-anchor="middle" font-size="8.5" fill="#8598ab">条基金</text></svg>';
  };

  const pie = (colors) => {
    const cx = 52, cy = 52, r = 44;
    let a0 = -Math.PI / 2, s = '';
    TRUSTEES.forEach((t, i) => {
      const a1 = a0 + (t[1] / 100) * Math.PI * 2;
      const p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)];
      const p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
      s += '<path d="M' + cx + ' ' + cy + 'L' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'Z" fill="' + colors[i % colors.length] + '"/>';
      a0 = a1;
    });
    return '<svg viewBox="0 0 104 104" width="104" height="104">' + s + '</svg>';
  };

  const thermo = (p) => {
    /* 竖向温度计：液柱三段渐变 + 气泡标出当前位置 */
    const id = 'g' + p.id;
    return '<svg viewBox="0 0 34 132" width="34" height="132">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="1" x2="0" y2="0">' +
        '<stop offset="0" stop-color="' + p.th[2] + '"/><stop offset=".55" stop-color="' + p.th[1] + '"/><stop offset="1" stop-color="' + p.th[0] + '"/></linearGradient></defs>' +
      '<rect x="11" y="6" width="12" height="100" rx="6" fill="#eef3f8"/>' +
      '<rect x="11" y="46" width="12" height="60" rx="6" fill="url(#' + id + ')"/>' +
      '<circle cx="17" cy="112" r="13" fill="url(#' + id + ')"/>' +
      '<circle cx="17" cy="46" r="4.6" fill="#fff" stroke="' + p.th[0] + '" stroke-width="2"/>' +
      '</svg>';
  };

  const legend = (items, colors, fmt) => '<ul class="lg">' + items.map((t, i) =>
    '<li><i style="background:' + colors[i % colors.length] + '"></i>' + t[0] + '<em>' + fmt(t) + '</em></li>').join('') + '</ul>';

  document.getElementById('list').innerHTML = P.map((p) => {
    return '<section class="cell">' +
      '<div class="cell-hd"><span class="id">' + p.id + '</span><h2>' + p.name + '</h2><span class="desc">' + p.desc + '</span></div>' +
      '<div class="sw">' + p.c.map((c) => '<i style="background:' + c + '"></i>').join('') + '</div>' +
      '<div class="charts">' +
        '<div class="box"><h3>基金种类分布</h3><div class="flex">' + donut(p.c) +
          legend(TYPES, p.c, (t) => t[1] + ' 条') + '</div></div>' +
        '<div class="box"><h3>受托人市场份额</h3><div class="flex">' + pie(p.c) +
          legend(TRUSTEES, p.c, (t) => t[1].toFixed(1) + '%') + '</div></div>' +
        '<div class="box"><h3>市场涨跌温度计</h3><div class="thermo">' + thermo(p) +
          '<div style="flex:1;min-width:0">' +
            '<div class="th-stats"><span>近 1 年平均 <b style="color:' + p.th[0] + '">+3.57%</b></span>' +
            '<span>中位数 <b style="color:' + p.th[0] + '">+3.77%</b></span></div>' +
            '<div class="th-bar"><i style="width:77.5%;background:' + p.up + '"></i><i style="width:22.5%;background:' + p.down + '"></i></div>' +
            '<div class="th-legend"><span><i style="background:' + p.up + '"></i>上涨 338</span>' +
            '<span><i style="background:' + p.down + '"></i>下跌 98</span></div>' +
          '</div></div></div>' +
      '</div></section>';
  }).join('');
})();
</script>
</body>
</html>
