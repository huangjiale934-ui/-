<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整页设计 20 套 · 页头合并 + 侧栏导航</title>
<style>
  :root { --brand:#0866bb; --brand2:#2f7fc1; --ink:#16283e; --t2:#3d5470; --t3:#8595a8; --line:#e3ecf4; --soft:#edf7ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f4f7fb; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif; }
  .hd { max-width:1364px; margin:0 auto; padding:34px 20px 10px; }
  .hd h1 { margin:0 0 8px; font-size:24px; letter-spacing:-.3px; }
  .hd p { margin:0; color:#5b6f85; font-size:13.5px; line-height:1.8; }
  .hd b { color:var(--brand); }
  .grid { max-width:1364px; margin:0 auto; padding:18px 20px 60px; display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .cell { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 6px 22px rgba(20,50,90,.07); }
  .cap { display:flex; align-items:baseline; gap:8px; padding:11px 14px; border-bottom:1px solid #eef3f9; }
  .cap b { font-size:13px; color:var(--brand); letter-spacing:.4px; }
  .cap span { font-size:12.5px; color:#63798f; }
  .view { position:relative; height:424px; overflow:hidden; background:#f7fafd; }
  .frame { position:absolute; top:0; left:0; width:1120px; height:752px; transform:scale(.58); transform-origin:top left; background:#fff; }

  /* ===== 迷你页：真实结构，仅尺寸缩小 ===== */
  .pg { display:flex; flex-direction:column; height:100%; font-size:14px; }
  .top { height:64px; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:1px solid var(--line); background:#fff; }
  .lg { display:flex; align-items:center; gap:8px; flex:none; }
  .lg i { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#0b5ea8,#3aa0e6); display:block; }
  .lg b { font-size:13px; letter-spacing:.2px; }
  .lg em { font-style:normal; font-size:9.5px; color:var(--t3); display:block; }
  .tk { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:14px; overflow:hidden; }
  .tk span { font-size:10.5px; color:var(--t2); white-space:nowrap; }
  .tk b { font-size:11.5px; }
  .up { color:#d93025; } .dn { color:#12996b; }
  .lang { flex:none; display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .lang i { font-style:normal; font-size:10px; padding:3px 7px; color:var(--t2); }
  .lang i.on { background:var(--brand); color:#fff; }
  .body { flex:1 1 auto; display:flex; min-height:0; }
  .side { width:186px; flex:none; border-right:1px solid var(--line); padding:12px 9px; display:flex; flex-direction:column; gap:3px; background:#fff; }
  .sgrp { font-size:12.5px; font-weight:700; color:#2c4258; padding:2px 8px 9px; }
  .snv { display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:7px; font-size:12px; color:#3c5268; }
  .snv.on { background:#e8f1fb; color:var(--brand); font-weight:600; }
  .snv i { width:11px; height:11px; border:1.5px solid currentColor; border-radius:3px; display:block; }
  .ssub { margin-left:16px; display:flex; flex-direction:column; gap:1px; }
  .ssub span { font-size:11px; padding:4px 8px; color:#5b7186; border-radius:5px; display:flex; justify-content:space-between; }
  .ssub span.on { background:#eef5fd; color:var(--brand); font-weight:600; }
  .sfoot { margin-top:auto; font-size:10px; color:var(--t3); text-align:center; padding-top:8px; border-top:1px solid #eef3f9; }
  .main { flex:1 1 auto; min-width:0; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .card { border:1px solid var(--line); border-radius:10px; background:#fff; padding:12px; }
  .row { display:flex; align-items:center; gap:8px; }
  .h { font-size:13px; font-weight:700; }
  .pill { font-size:10px; padding:3px 8px; border-radius:5px; border:1px solid #cfe1f2; color:var(--brand); }
  .pill.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .ch { flex:1 1 auto; height:150px; border-radius:8px; border:1px dashed #cfe0f0;
        background:repeating-linear-gradient(180deg,#fff 0 29px,#f2f7fc 29px 30px); }
  .bars { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .kpi b { display:block; font-size:15px; }
  .kpi span { font-size:10px; color:var(--t3); }
  .tb { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tb .th { display:grid; grid-template-columns:1.7fr .8fr .8fr .8fr; font-size:10px; color:var(--t3); background:#f7fafd; }
  .tb .tr { display:grid; grid-template-columns:1.7fr .8fr .8fr .8fr; font-size:10.5px; border-top:1px solid #eef3f9; }
  .tb .th >*, .tb .tr >* { padding:6px 8px; }
  .note { font-size:10px; color:#8fa3b6; }

  /* ===== 20 套差异点 ===== */
  /* S05 深色页头 */
  .s05 .top { background:#0d4f8b; border-bottom-color:#0d4f8b; }
  .s05 .lg b, .s05 .tk span, .s05 .tk b { color:#fff; }
  .s05 .lg em { color:#bcd8f0; }
  /* S02 行情两侧竖线 */
  .s02 .tk { border-left:1px solid var(--line); border-right:1px solid var(--line); padding:0 14px; }
  /* S04 页头留白更多 */
  .s04 .top { gap:22px; padding:0 22px; }
  .s04 .tk { justify-content:flex-end; }
  /* S06 两行页头 */
  .s06 .top { height:96px; flex-wrap:wrap; align-content:center; row-gap:6px; }
  .s06 .tk { order:3; flex:1 1 100%; }
  /* S07 通栏浅蓝渐层 */
  .s07 .top { background:linear-gradient(90deg,#f2f8ff,#eaf4ff 60%,#f7fbff); }
  /* S08 侧栏顶部搜索 */
  .s08 .search { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; margin-bottom:8px; color:#9aabbd; font-size:11px; }
  /* S09 侧栏带计数徽标 */
  .s09 .snv span.cnt { margin-left:auto; font-size:10px; background:#eef3f9; border-radius:999px; padding:1px 6px; color:#5b7186; }
  /* S10 侧栏分组小标题 */
  .s10 .sg2 { font-size:9.5px; color:#9aabbd; letter-spacing:.08em; padding:12px 9px 4px; font-weight:700; }
  /* S11 深色侧栏 */
  .s11 .side { background:#0d2136; border-right-color:#0d2136; }
  .s11 .sgrp { color:#fff; }
  .s11 .snv { color:#b9cde0; }
  .s11 .snv.on { background:#17456f; color:#fff; }
  .s11 .ssub span { color:#9db5ca; }
  .s11 .sfoot { color:#7f97ad; border-top-color:#1d3450; }
  /* S12 页头+侧栏同蓝 */
  .s12 .top { background:#0f4c81; border-bottom:0; }
  .s12 .lg b, .s12 .tk span, .s12 .tk b { color:#fff; }
  .s12 .side { background:#0f4c81; border-right:0; }
  .s12 .sgrp { color:#fff; } .s12 .snv { color:#c8dcee; } .s12 .snv.on { background:#1d6aa8; color:#fff; }
  .s12 .ssub span { color:#a9c4da; } .s12 .sfoot { color:#9ab8d0; border-top-color:#2a6ca3; }
  /* S13 行情做成胶囊 */
  .s13 .tk span { background:#f2f7fc; border-radius:999px; padding:4px 10px; }
  /* S14 行情淡底通栏 */
  .s14 .top { background:#f8fbfe; }
  /* S15 侧栏底部版本胶囊 */
  .s15 .sfoot span { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#f7fafd; }
  /* S16 页头右侧搜索 */
  .s16 .hs { flex:none; display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:7px; padding:5px 9px; color:#9aabbd; font-size:11px; }
  /* S17 行情只留涨跌 */
  .s17 .tk span.nm { display:none; }
  /* S18 侧栏 tab */
  .s18 .stab { display:flex; gap:4px; background:#f2f7fc; border-radius:8px; padding:3px; margin-bottom:8px; }
  .s18 .stab i { flex:1; text-align:center; font-style:normal; font-size:10.5px; padding:5px 0; border-radius:6px; color:#5b7186; }
  .s18 .stab i.on { background:#fff; color:var(--brand); font-weight:700; box-shadow:0 1px 3px rgba(20,50,90,.08); }
  /* S19 侧栏图标着色块 */
  .s19 .snv i { width:16px; height:16px; border-radius:5px; background:#e8f1fb; border:0; }
  .s19 .snv.on i { background:var(--brand); }
  /* S20 极简：行情折叠 */
  .s20 .tk { display:none; }
  .s20 .mkbtn { margin-left:auto; font-size:11px; color:var(--brand); border:1px solid #cfe1f2; border-radius:6px; padding:4px 9px; }
</style>
</head>
<body>
<div class="hd">
  <h1>整页设计 · 20 套（页头合并行情 + 左侧全站导航）</h1>
  <p>每格是<b>真实 1120×752 整页</b>缩放到 46%，包含页头、行情、侧栏、内容区。挑一个编号告诉我（例：「S07」），我按它把线上改掉。</p>
</div>
<div class="grid" id="grid"></div>

<script>
(function () {
  const NAV = [
    ['首页', 0], ['基金最新数据', 1], ['MPFA 基金榜单', 0], ['供款计算器', 0]
  ];
  const SUB = [['全部', 451], ['宏利', 29], ['银联信托', 171], ['友邦信托', 21], ['HSBC', 77]];
  const TK = [
    ['强积金市场指数', '1,831.76', '-0.22%', 'dn'],
    ['股票积金', '2,183.24', '-0.41%', 'dn'],
    ['混合积金', '1,728.03', '-0.08%', 'dn'],
    ['债券积金', '1,046.46', '+0.20%', 'up'],
    ['恒生指数', '23,294.42', '+1.46%', 'up'],
    ['上证指数', '3,599.02', '-1.44%', 'dn']
  ];
  function ticker(cls) {
    return TK.map(([n, v, p, c]) => '<span' + (cls === 's17' ? ' class="nm"' : '') + '>' + n +
      ' <b>' + v + '</b> <b class="' + c + '">' + p + '</b></span>').join('');
  }
  function header(kind) {
    const lg = '<div class="lg"><i></i><div><b>广州精研数据有限公司</b><em>香港强积金数据分析平台</em></div></div>';
    const lang = '<div class="lang"><i class="on">简</i><i>繁</i><i>EN</i></div>';
    let mid = '<div class="tk">' + ticker(kind) + '</div>';
    if (kind === 's16') mid = '<div class="tk">' + ticker() + '</div><div class="hs">⌕ 搜索基金 / 指数</div>';
    if (kind === 's20') mid = '<div class="tk">' + ticker() + '</div><span class="mkbtn">行情 ▾</span>';
    return '<div class="top">' + lg + mid + lang + '</div>';
  }
  function sidebar(kind) {
    let h = '';
    if (kind === 's18') h += '<div class="stab"><i class="on">数据</i><i>工具</i></div>';
    h += '<div class="sgrp">强积金数据分析平台</div>';
    if (kind === 's08') h += '<div class="search">⌕ 搜索基金</div>';
    const navHtml = NAV.map(([n, on], i) => {
      if (i === 1) {
        let row = '<div class="snv on"><i></i>' + n + (kind === 's09' ? '<span class="cnt">451</span>' : '') + ' ⓘ ▾</div>';
        row += '<div class="ssub">' + SUB.map(([s, c], j) => '<span class="' + (j === 0 ? 'on' : '') + '">' + s +
          (kind === 's09' ? '<b>' + c + '</b>' : '') + '</span>').join('') + '</div>';
        return row;
      }
      return '<div class="snv' + (on ? ' on' : '') + '"><i></i>' + n + (kind === 's09' && i === 2 ? '<span class="cnt">26</span>' : '') + ' ⓘ</div>';
    }).join('');
    if (kind === 's10') {
      h += navHtml.split('MPFA 基金榜单')[0] + '<div class="sg2">数据与榜单</div>' +
        navHtml.slice(navHtml.indexOf('MPFA 基金榜单') - 30);
    } else {
      h += navHtml;
    }
    h += '<div class="sfoot">' + (kind === 's15' ? '<span>● 数据每日自动同步 · 2026-11-02</span>' : '● 数据每日自动同步 · 2026-11-02') + '</div>';
    return '<div class="side">' + h + '</div>';
  }
  function main() {
    return '<div class="main">' +
      '<div class="card"><div class="row"><span class="h">基金走势对比图</span><span class="pill">＋ 添加指数</span>' +
        '<span class="pill">＋ 添加基金 2</span><span class="pill">清空</span>' +
        '<span style="margin-left:auto" class="row"><span class="pill on">1年</span><span class="pill">3年</span>' +
        '<span class="pill">5年</span><span class="pill">10年</span><span class="pill">全部</span><span class="pill">选择日期</span></span></div>' +
        '<div class="ch" style="margin-top:10px;position:relative;overflow:hidden">' +
          '<svg viewBox="0 0 640 150" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">' +
          '<polyline points="0,96 26,88 52,104 78,74 104,80 130,60 156,72 182,110 208,96 234,120 260,104 286,86 312,92 338,64 364,70 390,48 416,58 442,40 468,52 494,34 520,44 546,26 572,38 598,20 624,28 640,18" fill="none" stroke="#0866bb" stroke-width="2.2"/></svg></div>' +
        '<div class="note" style="margin-top:8px">点线条可改颜色 / 线宽 / 线型　纵轴为累计涨跌幅…</div></div>' +
      '<div class="bars"><div class="kpi"><span>成分基金</span><b>451</b></div>' +
        '<div class="kpi"><span>受托人</span><b>11</b></div>' +
        '<div class="kpi"><span>市场总规模</span><b>1.68 万亿</b></div>' +
        '<div class="kpi"><span>近 1 年平均</span><b class="up">+3.79%</b></div></div>' +
      '<div class="tb"><div class="th"><span>基金名称</span><span>近1年</span><span>日涨跌</span><span>规模</span></div>' +
        ['宏利MPF康健护理基金', '银联信托增长基金', '友邦强积金优选计划', 'HSBC 恒指基金'].map((n) =>
          '<div class="tr"><span>' + n + '</span><span class="up">+12.34%</span><span class="dn">-0.42%</span><span>4,535.50</span></div>').join('') +
      '</div></div>';
  }
  const LIST = [
    ['S01', '现状微调：LOGO + 行情 + 语言，一条细线分隔', 's01'],
    ['S02', '行情区两侧加竖线，像 Bloomberg 带', 's02'],
    ['S03', '行情做成浅底胶囊，视觉更软', 's13'],
    ['S04', '页头极简：行情靠右，留白更多', 's04'],
    ['S05', '深蓝页头（导航蓝），白字白线', 's05'],
    ['S06', '页头两行：品牌 + 语言在上，行情独占一行', 's06'],
    ['S07', '浅蓝渐层页头，最轻的商务感', 's07'],
    ['S08', '侧栏加全局搜索框，页头不加东西', 's08'],
    ['S09', '侧栏入口带计数徽标（451 / 26）', 's09'],
    ['S10', '侧栏分组小标题（数据 / 工具）', 's10'],
    ['S11', '深色侧栏，页头保持白色', 's11'],
    ['S12', '页头 + 侧栏同一深蓝，整块导航区', 's12'],
    ['S13', '行情胶囊 + 页头细分隔', 's13'],
    ['S14', '页头淡底（#f8fbfe），内容更亮', 's14'],
    ['S15', '侧栏底部版本做成胶囊', 's15'],
    ['S16', '页头右侧加一个搜索框', 's16'],
    ['S17', '行情只显示数值与涨跌，省名字', 's17'],
    ['S18', '侧栏顶部「数据 / 工具」分段切换', 's18'],
    ['S19', '侧栏图标做成色块，选中反白', 's19'],
    ['S20', '行情折叠成「行情 ▾」按钮，最省空间', 's20']
  ];
  document.getElementById('grid').innerHTML = LIST.map(([id, desc, cls]) =>
    '<div class="cell"><div class="cap"><b>' + id + '</b><span>' + desc + '</span></div>' +
    '<div class="view"><div class="frame"><div class="pg ' + cls + '">' + header(cls) +
    '<div class="body">' + sidebar(cls) + main() + '</div></div></div></div></div>').join('');
})();
</script>
</body>
</html>
