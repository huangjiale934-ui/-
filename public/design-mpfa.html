<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积金局月度数据 · 20 种版式方案｜广州精研数据有限公司</title>
<style>
  :root{
    --brand:#0866bb; --brand-2:#0b3b6f; --ink:#1b2b3d; --ink-2:#5b7086; --ink-3:#8ba0b6;
    --line:#e2ebf4; --bg:#f4f7fb; --card:#fff;
    --up:#c62b2b; --down:#12805a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 "Microsoft YaHei","PingFang SC","Noto Sans TC",system-ui,sans-serif}
  .page{max-width:1280px;margin:0 auto;padding:28px 22px 60px}
  .lede{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:18px}
  .lede h1{margin:0 0 8px;font-size:22px;letter-spacing:.4px}
  .lede p{margin:6px 0;color:var(--ink-2);font-size:13px}
  .lede .kbd{display:inline-block;background:#eef4fb;border-radius:4px;padding:1px 6px;font-size:12px;color:var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
  .cell{background:transparent}
  .cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;margin:0 2px 8px}
  .cap b{font-size:13.5px;letter-spacing:.3px;flex:0 0 auto;white-space:nowrap}
  .cap > span{flex:0 0 auto;white-space:nowrap}
  .cap em{font-style:normal;font-size:11px;color:var(--ink-3);flex:1 1 100%;line-height:1.5}
  .cap .now{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:10.5px;color:#0b6b4a;background:#e7f5ee;border-radius:3px;padding:1px 6px;font-weight:700}
  .mock{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(16,48,80,.07)}
  .mock{display:flex;flex-direction:column}
  .mock .hd{padding:13px 15px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .mock .hd .hd-l{min-width:0}
  .mock .hd .badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.8px;padding:1px 6px;border-radius:3px}
  .mock .hd h3{margin:7px 0 3px;font-size:15.5px;letter-spacing:.3px}
  .mock .hd p{margin:0;font-size:10.5px;line-height:1.5;opacity:.85}
  .mock .hd .asof{flex:0 0 auto;text-align:right;font-size:9.5px;opacity:.75;line-height:1.3}
  .mock .hd .asof b{display:block;font-size:14px;letter-spacing:.2px}
  .t{width:100%;border-collapse:collapse;font-size:10.5px}
  .t th,.t td{padding:5px 7px;text-align:left;white-space:nowrap}
  .t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
  .t .n{color:var(--ink-3)}
  .t .up{color:var(--up)} .t .down{color:var(--down)}
  .ft{padding:7px 15px 9px;font-size:9.5px;opacity:.6}
  /* ---------- v01 深蓝月报（当前） ---------- */
  .v01 .hd{background:linear-gradient(135deg,#0b2f57,#14507f 60%,#1b6296);color:#fff;padding-bottom:15px}
  .v01 .hd .badge{background:#fff;color:#0b2f57}
  .v01 .t th{background:#eef3f8;color:#28425e;border-bottom:1px solid #cfdbe8;font-weight:600}
  .v01 .t td{border-bottom:1px dashed #e7eef5}
  /* ---------- v02 公文红头 ---------- */
  .v02 .hd{border-left:5px solid #a3231f;padding-left:15px;background:#fffdfb}
  .v02 .hd h3{font-family:"Songti SC",SimSun,serif;font-size:17px;color:#8d1d1a}
  .v02 .hd .badge{background:#a3231f;color:#fff}
  .v02 .t th{background:#fbf3f2;color:#8d1d1a;border-top:2px solid #a3231f;border-bottom:1px solid #e8cfcd}
  .v02 .t td{border-bottom:1px solid #f1e6e4}
  /* ---------- v03 数据公报 ---------- */
  .v03 .hd{background:#f7fafd;border-bottom:1px solid var(--line)}
  .v03 .hd h3{font-size:13px;color:var(--ink-2);font-weight:600}
  .v03 .kpis{display:flex;gap:16px;padding:10px 15px 2px}
  .v03 .kpi b{display:block;font-size:19px;line-height:1.1}
  .v03 .kpi span{font-size:9.5px;color:var(--ink-3)}
  .v03 .t th{border-bottom:2px solid #0b3b6f;color:#0b3b6f}
  .v03 .t td{border-bottom:1px solid #f0f4f8}
  /* ---------- v04 月度卡片 ---------- */
  .v04 .hd{background:#0b3b6f;color:#fff}
  .v04 .hd .badge{background:#ffd166;color:#4a3200}
  .v04 .body{padding:10px 12px 14px;background:#f6f9fd}
  .v04 .mrow{display:flex;justify-content:space-between;background:#fff;border:1px solid #e0eaf5;
    border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:10.5px}
  /* ---------- v05 侧栏目录 ---------- */
  .v05 .body{display:flex}
  .v05 .side{width:92px;flex:0 0 92px;background:#eef4fb;padding:9px 8px;font-size:10px;color:#5b7086}
  .v05 .side b{display:block;color:#0b3b6f;margin-bottom:6px;font-size:10.5px}
  .v05 .side i{display:block;padding:3px 0;font-style:normal}
  .v05 .side i.on{color:#0866bb;font-weight:700;border-left:2px solid #0866bb;padding-left:6px;margin-left:-8px}
    .v05 .t{font-size:9px}
  .v05 .t th,.v05 .t td{padding:4px 4px}
  .v05 .t th{background:#fff;border-bottom:1px solid #cfdbe8;color:#5b7086;font-weight:600}
  .v05 .t td{border-bottom:1px solid #eef3f8}
  /* ---------- v06 双色带 ---------- */
  .v06 .hd{background:#0b3b6f;color:#fff}
  .v06 .t tbody tr:nth-child(odd){background:#f6f9fd}
  .v06 .t th{background:#123f6d;color:#dbebf8}
  .v06 .t td{border-bottom:1px solid #eef3f8}
  /* ---------- v07 报纸栏线 ---------- */
  .v07 .hd{background:#fff}
  .v07 .hd h3{font-family:Georgia,"Songti SC",serif}
  .v07 .t{border-top:2px solid #1b2b3d;border-bottom:2px solid #1b2b3d}
  .v07 .t th{font-family:Georgia,"Songti SC",serif;border-bottom:1px solid #1b2b3d;background:#fff}
  .v07 .t td{border-bottom:1px dotted #d7e0ea}
  /* ---------- v08 终端风 ---------- */
  .v08{background:#0e1622;color:#d6e2ee}
  .v08 .hd{background:#0b1119;border-bottom:1px solid #1e2c3d}
  .v08 .hd .badge{background:#16324a;color:#7fc4ff}
  .v08 .t{font-family:Consolas,Menlo,monospace}
  .v08 .t th{color:#6f8ba7;border-bottom:1px solid #22303f;background:#0e1622}
  .v08 .t td{border-bottom:1px solid #17222e}
  .v08 .t .up{color:#ff7b72} .v08 .t .down{color:#5fd39a}
  .v08 .ft{color:#63798f}
  /* ---------- v09 阶梯条 ---------- */
  .v09 .hd{background:#fff;border-bottom:1px solid var(--line)}
  .v09 .bar{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,#2e7bd1,#8fbde8);vertical-align:middle;margin-left:6px}
  .v09 .t th{background:#fbfdff;color:#3a5a7a;border-bottom:1px solid var(--line)}
  .v09 .t td{border-bottom:1px solid #f0f5fa}
  /* ---------- v10 分组折叠 ---------- */
  .v10 .hd{background:#f8fbfe;border-bottom:2px solid #0b3b6f}
  .v10 .grp{background:#eaf2fa;color:#0b3b6f;font-weight:700;font-size:10px;padding:5px 9px}
  .v10 .t th{color:#5b7086;background:#fff}
  .v10 .t td{border-bottom:1px solid #f2f6fa}
  /* ---------- v11 时间轴 ---------- */
  .v11 .body{display:flex}
  .v11 .rail{width:44px;border-right:1px solid var(--line);padding:8px 0;text-align:center;font-size:9.5px;color:#8ba0b6}
  .v11 .rail b{display:block;color:#0b3b6f;font-size:10.5px;margin-bottom:4px}
  .v11 .t th{border-bottom:1px solid var(--line);color:#5b7086;background:#fff}
  .v11 .t td{border-bottom:1px solid #f4f8fc}
  /* ---------- v12 仪表盘 ---------- */
  .v12 .hd{background:#fff}
  .v12 .row{display:flex;gap:8px;padding:0 13px 9px}
  .v12 .box{flex:1;background:#f5f9fe;border:1px solid #e3edf7;border-radius:8px;padding:6px 8px}
  .v12 .box b{display:block;font-size:15px;color:#0b3b6f}
  .v12 .box span{font-size:9px;color:#8ba0b6}
  .v12 .t th{background:#fff;border-bottom:1px solid #dbe6f1;color:#5b7086}
  .v12 .t td{border-bottom:1px solid #eef4fa}
  /* ---------- v13 票据风 ---------- */
  .v13 .hd{background:#fff;border-bottom:1px dashed #c9d7e6}
  .v13 .hd .badge{background:#eef4fb;color:#0b3b6f;border:1px solid #cfdff0}
  .v13 .t td{border-bottom:1px dashed #dbe6f1}
  .v13 .t th{color:#7b8fa5;font-weight:600}
  /* ---------- v14 极简 ---------- */
  .v14 .hd{background:#fff;padding-bottom:6px}
  .v14 .hd h3{font-size:14px}
  .v14 .t th{border-bottom:1px solid #1b2b3d;color:#1b2b3d;font-weight:700;background:#fff}
  .v14 .t td{border-bottom:1px solid #eef2f7}
  /* ---------- v15 官方绿 ---------- */
  .v15 .hd{background:#0f5b4a;color:#fff}
  .v15 .hd .badge{background:#d8f0e6;color:#0f5b4a}
  .v15 .t th{background:#eaf6f1;color:#0f5b4a;border-bottom:1px solid #cbe6db}
  .v15 .t td{border-bottom:1px solid #eff7f3}
  /* ---------- v16 深色卡 ---------- */
  .v16{background:#101b2b;color:#e6eef7}
  .v16 .hd{background:#152740;border-bottom:1px solid #22385a}
  .v16 .hd .badge{background:#2b4f7d;color:#cfe4ff}
  .v16 .t th{background:#152740;color:#9db6d1;border-bottom:1px solid #22385a}
  .v16 .t td{border-bottom:1px solid #1b2c44}
  /* ---------- v17 手风琴 ---------- */
  .v17 .hd{background:#fff;border-bottom:1px solid var(--line)}
  .v17 .acc{border-top:1px solid #eef3f8}
  .v17 .acc .h{display:flex;justify-content:space-between;padding:6px 10px;background:#f7fafd;font-size:10.5px;font-weight:600;color:#22405f}
  .v17 .acc .r{display:flex;justify-content:space-between;padding:5px 10px 5px 18px;font-size:10.5px;border-bottom:1px solid #f4f8fc}
  /* ---------- v18 图主表辅 ---------- */
  .v18 .hd{background:#fff}
  .v18 .chart{display:flex;align-items:flex-end;gap:5px;height:44px;padding:0 15px 8px}
  .v18 .chart i{flex:1;background:#cfe1f4;border-radius:2px 2px 0 0}
  .v18 .chart i.hi{background:#0866bb}
  .v18 .t th{background:#fbfdff;color:#5b7086;border-bottom:1px solid #e6eff8}
  .v18 .t td{border-bottom:1px solid #f4f8fc}
  /* ---------- v19 双栏 ---------- */
  .v19 .body{display:flex;gap:0}
  .v19 .lft{flex:1.5}
  .v19 .rgt{flex:1;background:#f7fafd;border-left:1px solid var(--line);padding:9px 11px;font-size:10px;color:#5b7086}
  .v19 .rgt b{display:block;color:#0b3b6f;margin-bottom:4px;font-size:10.5px}
  .v19 .t th{border-bottom:1px solid #dbe6f1;color:#5b7086;background:#fff}
  .v19 .t td{border-bottom:1px solid #f1f6fb}
  /* ---------- v20 印章风 ---------- */
  .v20 .hd{background:#fff;border-bottom:3px double #0b3b6f}
  .v20 .hd .badge{background:#0b3b6f;color:#fff}
  .v20 .t th{background:#f6f9fd;color:#26476b;border-bottom:1px solid #c9d7e6}
  .v20 .t td{border-bottom:1px solid #eef4fa}
  .v20 .seal{position:relative}
  .v20 .seal:after{content:"MPFA";position:absolute;right:16px;top:64px;width:52px;height:52px;border:2px solid rgba(163,35,31,.55);
    border-radius:50%;color:rgba(163,35,31,.65);font:700 11px/52px Georgia,serif;text-align:center;transform:rotate(-12deg)}
  @media (max-width:520px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="page">
  <section class="lede">
    <h1>积金局月度数据 · 20 种版式方案</h1>
    <p>同一张表（名次 / 基金 / 受托人 / 近1年 / 近5年 / 规模），用 20 种版式呈现。目标只有一个：<b>让客户一眼看出这是「积金局月报」，不是本站的「基金最新数据」</b>。</p>
    <p>每张卡里的数字与真实页面一致（海通韩国基金 98.35% 等），只改版式不改数据。<span class="kbd">M01</span> 是当前线上采用的版本，其余为备选。挑中哪一版，回复编号即可。</p>
  </section>
  <div class="grid" id="grid"></div>
</div>
<script>
const ROWS = [
  ['1','海通韩国基金 - A类别','HSBC','+98.35%','+21.24%','12.32'],
  ['2','海通韩国基金 - T类别','HSBC','+98.35%','+21.24%','230.26'],
  ['3','海通亚太基金 - T类别','HSBC','+48.21%','+11.26%','94.73'],
];
const VARIANTS = [
  ['M01','深蓝月报头 + 细线报表','当前采用：深蓝渐变抬头，表格去斑马纹、改细虚线，像一份官方月报','v01'],
  ['M02','公文红头','左侧红色竖条 + 宋体标题，最容易让人联想到「官方文件」，但偏严肃','v02'],
  ['M03','数据公报','抬头只留小字，先用三个大数字交代规模/数量，再进表格','v03'],
  ['M04','月度卡片','每月一张卡，条目式排列；适合手机端，但一屏放不下几只基金','v04'],
  ['M05','侧栏目录','左侧固定「月份 / 榜单」目录，右侧内容；像一份可翻阅的月报','v05'],
  ['M06','双色带','海军蓝表头 + 浅蓝隔行，最接近传统年报的观感','v06'],
  ['M07','报纸栏线','上下双线表头 + 衬线字，去掉所有底色，最「印刷品」','v07'],
  ['M08','终端风','深色底 + 等宽数字；数据感强，但与站内其他页面反差最大','v08'],
  ['M09','阶梯条','每行右侧带一条规模短条，表格本身仍是表，信息密度不降','v09'],
  ['M10','分组折叠','按基金种类分组，组头单独一行；条目多时最清楚','v10'],
  ['M11','时间轴','左侧月份竖排，右侧当月榜单；强调「按月公布」这件事','v11'],
  ['M12','仪表盘','抬头下方四个小指标盒，再进表格；信息量最大','v12'],
  ['M13','票据风','虚线分隔 + 编号标签，像一张对账单','v13'],
  ['M14','极简','只有一条粗线和一个标题，其余全白；最克制','v14'],
  ['M15','官方绿','用 MPFA 网站的墨绿做主色，身份联想最强','v15'],
  ['M16','深色卡','整页深蓝黑，数据用浅色；适合投屏演示','v16'],
  ['M17','手风琴','按类别折叠，点开才展开基金；首屏最干净','v17'],
  ['M18','图主表辅','顶部一条类别柱图，下面才是表；先看趋势再看明细','v18'],
  ['M19','双栏','左表右说明，口径解释与表同屏，不用再往下找','v19'],
  ['M20','印章风','右下角一枚 MPFA 圆形印章，双线表头；辨识度最高','v20'],
];

function table(v){
  if (v === 'v10') {
    return '<div class="grp">股票基金 · 47 条</div>' + baseTable() + '<div class="grp">混合资产基金 · 34 条</div>';
  }
  if (v === 'v17') {
    return '<div class="acc"><div class="h"><span>股票基金</span><span>47 条 ▾</span></div>' +
      ROWS.slice(0,2).map(r=>'<div class="r"><span>'+r[1]+'</span><span class="up">'+r[3]+'</span></div>').join('') +
      '</div><div class="acc"><div class="h"><span>混合资产基金</span><span>34 条 ▸</span></div></div>' +
      '<div class="acc"><div class="h"><span>保证基金</span><span>5 条 ▸</span></div></div>';
  }
  return baseTable();
}
function baseTable(){
  return '<table class="t"><thead><tr><th>名次</th><th>基金名称</th><th>受托人</th><th class="num">近1年</th><th class="num">近5年</th><th class="num">规模</th></tr></thead><tbody>' +
    ROWS.map(r=>'<tr><td class="n">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="num up">'+r[3]+'</td><td class="num up">'+r[4]+'</td><td class="num">'+r[5]+'</td></tr>').join('') +
    '</tbody></table>';
}
function head(v, title, sub, badge){
  if (v === 'v03') {
    return '<div class="hd"><div class="hd-l"><h3>积金局月度数据 · 基金表现公报</h3></div></div>' +
      '<div class="kpis"><div class="kpi"><b>447</b><span>成分基金（条）</span></div>' +
      '<div class="kpi"><b>11</b><span>受托人</span></div>' +
      '<div class="kpi"><b>2026-09-30</b><span>资料截至</span></div></div>';
  }
  if (v === 'v12') {
    return '<div class="hd"><div class="hd-l"><span class="badge">MPFA</span><h3>积金局月度数据</h3><p>按月公布 · 与本站每日自算净值口径不同</p></div></div>' +
      '<div class="row"><div class="box"><b>447</b><span>成分基金</span></div><div class="box"><b>2026-09-30</b><span>资料截至</span></div>' +
      '<div class="box"><b>+18.6%</b><span>近1年平均</span></div></div>';
  }
  if (v === 'v18') {
    return '<div class="hd"><div class="hd-l"><span class="badge">MPFA</span><h3>积金局月度数据</h3><p>各类别近 12 个月年率化净回报</p></div></div>' +
      '<div class="chart">' + [42,66,38,72,55,88,60].map((h,i)=>'<i style="height:'+h+'%" class="'+(i===5?'hi':'')+'"></i>').join('') + '</div>';
  }
  return '<div class="hd"><div class="hd-l"><span class="badge">MPFA</span><h3>'+title+'</h3><p>'+sub+'</p></div>' +
    '<div class="asof">资料截至<b>2026-09-30</b></div></div>';
}
function body(v){
  if (v === 'v04') {
    return '<div class="body">' + ROWS.map(r=>'<div class="mrow"><span>'+r[0]+'. '+r[1]+'</span><b class="up">'+r[3]+'</b></div>').join('') + '</div>';
  }
  if (v === 'v11') {
    return '<div class="body"><div class="rail"><b>2026</b>09 月<br>08 月<br>07 月</div><div style="flex:1">'+baseTable()+'</div></div>';
  }
  if (v === 'v05') {
    return '<div class="body"><div class="side"><b>月度公报</b><i class="on">2026-09</i><i>2026-08</i><i>2026-07</i><i>2026-06</i></div><div style="flex:1">'+baseTable()+'</div></div>';
  }
  if (v === 'v19') {
    return '<div class="body"><div class="lft">'+baseTable()+'</div><div class="rgt"><b>口径说明</b>数据来自积金局「强积金基金平台」，按月公布；已扣除费用、计入分红再投资。与本站每日自算净值不可直接相减。</div></div>';
  }
  return table(v);
}
document.getElementById('grid').innerHTML = VARIANTS.map(([id,name,desc,cls])=>(
  '<div class="cell"><div class="cap"><b>'+id+'</b><span>'+name+'</span><em>'+desc+'</em>'+(id==='M01'?'<span class="now">线上</span>':'')+'</div>'+
  '<div class="mock '+cls+(cls==='v20'?' seal':'')+'">'+head(cls, name, '数据来自积金局「强积金基金平台」，按月公布', 'MPFA')+body(cls)+
  '<div class="ft">数据来源：积金局「强积金基金平台」 · 截至 2026-09-30</div></div></div>'
)).join('');
</script>
</body>
</html>
