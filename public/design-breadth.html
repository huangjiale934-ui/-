<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230f4c81%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首屏情绪卡 · 37% 的 20 种画法</title>
<style>
  :root { --brand:#0866bb; --ink:#16283e; --line:#e3ecf4; }
  * { box-sizing:border-box; }
  body { margin:0; background:#eef3f9; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif; }
  .hd { max-width:1100px; margin:0 auto; padding:34px 20px 8px; }
  .hd h1 { margin:0 0 10px; font-size:24px; }
  .hd p { margin:0 0 6px; color:#55708c; font-size:13.5px; line-height:1.85; }
  .hd b { color:var(--brand); }
  .list { max-width:1100px; margin:0 auto; padding:14px 20px 70px; display:grid;
    grid-template-columns:repeat(2,1fr); gap:16px; }
  .cell { background:#fff; border-radius:13px; box-shadow:0 4px 18px rgba(20,50,90,.07); overflow:hidden; }
  .cap { display:flex; align-items:baseline; gap:8px; padding:9px 13px; border-bottom:1px solid #eef3f9; background:#fbfdff; }
  .cap b { font-size:12.5px; color:var(--brand); letter-spacing:.4px; flex:none; }
  .cap span { font-size:11.5px; color:#63798f; }
  .demo { padding:13px; background:linear-gradient(108deg,#f5faff 0%,#eaf4fd 55%,#e2f0fc 100%); }

  /* 与线上完全一致的卡片外观（真实尺寸 372×68） */
  .card { display:flex; align-items:center; gap:14px; padding:11px 14px 11px 16px; min-width:372px; max-width:372px;
    background:#fff; border:1px solid #e0ecf7; border-radius:11px; box-shadow:0 6px 16px rgba(20,70,120,.07); }
  .art { width:96px; height:40px; flex:none; display:flex; align-items:flex-end; }
  .art svg { display:block; }
  .tx { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .tx b { font-size:14px; font-weight:700; color:#14314f; white-space:nowrap; }
  .tx b i { font-style:normal; color:#0866bb; font-size:16px; font-variant-numeric:tabular-nums; }
  .tx em { font-style:normal; font-size:11.5px; color:#8ba0b3; white-space:nowrap; }
  .go { margin-left:auto; flex:none; font-size:13px; font-weight:700; color:#0866bb; white-space:nowrap; }
</style>
</head>
<body>
<div class="hd">
  <h1>「近日 37% 的基金上涨」· 迷你图 20 种画法</h1>
  <p>现在左边只有 7 根柱（7 个交易日的涨跌），<b>看不出 37% 这个数</b>——柱子和文字各说各的。</p>
  <p>下面 20 套都把「37%」直接画进图里，卡片尺寸与线上一致（<b>372×68</b>，图区 96×40），文字部分不动。</p>
  <p>挑编号告诉我（例如「B04」「B12」），也可以说「B09 的线 + B02 的环」这种组合。</p>
</div>
<div class="list" id="list"></div>

<script>
(function () {
  const PCT = 37;
  const DAYS = [0.17, -1.33, 0.06, 0.22, 0.08, 0.47, -0.22];   // 最近 7 个交易日（真实数据）
  const DEEP = '#0866bb', MID = '#5fa4d8', LIGHT = '#cfe2f3', PALE = '#e8f2fa';
  const W = 96, H = 40;

  const svg = (inner, vb) => '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + (vb || W + ' ' + H) + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';

  /* 图区只有 96x40，规则：图形占满、最多一个数字（37%），不塞辅助小字 */
  const P7 = [46, 31, 52, 41, 38, 44, 37];

  /* B01 7 根柱（现状） */
  const b01 = () => {
    const max = Math.max.apply(null, DAYS.map(Math.abs));
    return DAYS.map((v, i) => {
      const h = Math.max(8, Math.round(Math.abs(v) / max * 26) + 8);
      return '<rect x="' + (i * 13.5) + '" y="' + (H - h) + '" width="9" height="' + h + '" rx="2.5" fill="' + (v >= 0 ? DEEP : LIGHT) + '"/>';
    }).join('');
  };

  /* B02 圆环进度 */
  const b02 = () => {
    const r = 16.5, c = 2 * Math.PI * r, on = c * PCT / 100;
    return '<circle cx="20" cy="20" r="' + r + '" fill="none" stroke="' + PALE + '" stroke-width="5.5"/>' +
      '<circle cx="20" cy="20" r="' + r + '" fill="none" stroke="' + DEEP + '" stroke-width="5.5" stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '" stroke-linecap="round" transform="rotate(-90 20 20)"/>' +
      '<text x="20" y="23.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="' + DEEP + '">37%</text>';
  };

  /* B03 十格分段条 */
  const b03 = () => {
    const on = Math.round(PCT / 100 * 10);
    let out = '';
    for (let i = 0; i < 10; i++) out += '<rect x="' + (i * 9.6) + '" y="14" width="7.6" height="14" rx="2" fill="' + (i < on ? DEEP : PALE) + '"/>';
    return out;
  };

  /* B04 点阵 10x4 */
  const b04 = () => {
    let out = '', n = 0;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 10; c++) {
      out += '<circle cx="' + (c * 9.6 + 4) + '" cy="' + (6 + r * 9.4) + '" r="3" fill="' + (n < PCT ? DEEP : PALE) + '"/>';
      n++;
    }
    return out;
  };

  /* B05 双段柱 + 37% 虚线 */
  const b05 = () => {
    const h = 34, y0 = 3;
    const bars = P7.map((v, i) => {
      const up = h * v / 100;
      return '<rect x="' + (i * 13.5) + '" y="' + y0 + '" width="9" height="' + h + '" rx="2.5" fill="' + LIGHT + '"/>' +
        '<rect x="' + (i * 13.5) + '" y="' + (y0 + h - up).toFixed(1) + '" width="9" height="' + up.toFixed(1) + '" rx="2.5" fill="' + DEEP + '"/>';
    }).join('');
    const y = (y0 + h - h * PCT / 100).toFixed(1);
    return bars + '<line x1="0" y1="' + y + '" x2="96" y2="' + y + '" stroke="#e0a03a" stroke-width="1.6" stroke-dasharray="4 3"/>';
  };

  /* B06 半环仪表 */
  const b06 = () => {
    const cx = 30, cy = 34, r = 24;
    const ang = Math.PI * (1 - PCT / 100);
    const x1 = cx + r * Math.cos(ang), y1 = cy - r * Math.sin(ang);
    return '<path d="M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + '" fill="none" stroke="' + PALE + '" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + '" fill="none" stroke="' + DEEP + '" stroke-width="7" stroke-linecap="round"/>' +
      '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="11" font-weight="800" fill="' + DEEP + '">37%</text>' +
      '<text x="' + (cx + 34) + '" y="26" font-size="9" fill="#8ba0b3">近一周</text>' +
      '<text x="' + (cx + 34) + '" y="38" font-size="9" fill="#8ba0b3">上涨</text>';
  };

  /* B07 液位瓶 */
  const b07 = () => {
    const x = 6, w = 26, h = 34, y0 = 3, fill = h * PCT / 100;
    return '<rect x="' + x + '" y="' + y0 + '" width="' + w + '" height="' + h + '" rx="6" fill="' + PALE + '"/>' +
      '<rect x="' + x + '" y="' + (y0 + h - fill).toFixed(1) + '" width="' + w + '" height="' + fill.toFixed(1) + '" rx="6" fill="' + DEEP + '"/>' +
      '<text x="' + (x + w + 12) + '" y="24" font-size="15" font-weight="800" fill="' + DEEP + '">37%</text>' +
      '<text x="' + (x + w + 12) + '" y="35" font-size="8.5" fill="#8ba0b3">上涨</text>';
  };

  /* B08 折线 + 面积 */
  const b08 = () => {
    const pts = P7.map((v, i) => (i * 15 + 3) + ',' + (36 - v * 0.52).toFixed(1));
    return '<polygon points="3,38 ' + pts.join(' ') + ' 93,38" fill="' + DEEP + '" opacity="0.12"/>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + DEEP + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="93" cy="' + (36 - 37 * 0.52).toFixed(1) + '" r="3.4" fill="#fff" stroke="' + DEEP + '" stroke-width="2.4"/>';
  };

  /* B09 柱 + 37% 参考线 */
  const b09 = () => {
    const max = Math.max.apply(null, DAYS.map(Math.abs));
    const bars = DAYS.map((v, i) => {
      const h = Math.max(6, Math.round(Math.abs(v) / max * 22) + 4);
      return '<rect x="' + (i * 10) + '" y="' + (36 - h) + '" width="7" height="' + h + '" rx="2" fill="' + (v >= 0 ? MID : LIGHT) + '"/>';
    }).join('');
    const y = 36 - 30 * PCT / 100;
    return bars + '<line x1="0" y1="' + y.toFixed(1) + '" x2="96" y2="' + y.toFixed(1) + '" stroke="' + DEEP + '" stroke-width="1.6" stroke-dasharray="4 3"/>' +
      '<rect x="66" y="' + (y - 11).toFixed(1) + '" width="30" height="14" rx="3.5" fill="#fff" stroke="' + DEEP + '"/>' +
      '<text x="81" y="' + (y - 1).toFixed(1) + '" text-anchor="middle" font-size="9.5" font-weight="800" fill="' + DEEP + '">37%</text>';
  };

  /* B10 横向双段条 */
  const b10 = () => {
    const w = 94, a = w * PCT / 100;
    return '<rect x="1" y="12" width="' + a.toFixed(1) + '" height="16" rx="8" fill="' + DEEP + '"/>' +
      '<rect x="' + a.toFixed(1) + '" y="12" width="' + (w - a).toFixed(1) + '" height="16" rx="8" fill="' + PALE + '"/>' +
      '<text x="' + (a / 2).toFixed(1) + '" y="23.5" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">37%</text>' +
      '<text x="' + (a + (w - a) / 2).toFixed(1) + '" y="23.5" text-anchor="middle" font-size="9" fill="#7d94a9">63%</text>';
  };

  /* B11 小饼图 */
  const b11 = () => {
    const r = 17, cx = 20, cy = 20, a = Math.PI * 2 * PCT / 100;
    const x2 = cx + r * Math.sin(a), y2 = cy - r * Math.cos(a);
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + PALE + '"/>' +
      '<path d="M' + cx + ' ' + cy + ' L' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 ' + (PCT > 50 ? 1 : 0) + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z" fill="' + DEEP + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="#fff"/>' +
      '<text x="' + cx + '" y="' + (cy + 3) + '" text-anchor="middle" font-size="8.5" font-weight="800" fill="' + DEEP + '">37%</text>';
  };

  /* B12 7 个圆点 */
  const b12 = () => {
    const max = Math.max.apply(null, DAYS.map(Math.abs));
    return DAYS.map((v, i) => {
      const r = 3.4 + Math.abs(v) / max * 4.6;
      return '<circle cx="' + (i * 14 + 6) + '" cy="20" r="' + r.toFixed(1) + '" fill="' + (v >= 0 ? DEEP : '#fff') + '" stroke="' + (v >= 0 ? DEEP : MID) + '" stroke-width="2"/>';
    }).join('');
  };

  /* B13 阶梯线 */
  const b13 = () => {
    let path = 'M0 ' + (36 - P7[0] * 0.55).toFixed(1);
    for (let i = 1; i < P7.length; i++) {
      const x = i * 15.5;
      path += ' H' + x.toFixed(1) + ' V' + (36 - P7[i] * 0.55).toFixed(1);
    }
    path += ' H96';
    return '<path d="' + path + '" fill="none" stroke="' + DEEP + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<line x1="0" y1="' + (36 - 37 * 0.55).toFixed(1) + '" x2="96" y2="' + (36 - 37 * 0.55).toFixed(1) + '" stroke="#e0a03a" stroke-width="1.4" stroke-dasharray="3 2"/>';
  };

  /* B14 环 + 7 天刻度点 */
  const b14 = () => {
    const r = 16.5, cx = 20, cy = 20, c = 2 * Math.PI * r, on = c * PCT / 100;
    let dots = '';
    for (let i = 0; i < 7; i++) {
      const ang = Math.PI * 2 * i / 7 - Math.PI / 2;
      dots += '<circle cx="' + (cx + (r + 6) * Math.cos(ang)).toFixed(1) + '" cy="' + (cy + (r + 6) * Math.sin(ang)).toFixed(1) + '" r="2.2" fill="' + (DAYS[i] >= 0 ? DEEP : LIGHT) + '"/>';
    }
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + PALE + '" stroke-width="4"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + DEEP + '" stroke-width="4" stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '" stroke-linecap="round" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
      dots +
      '<text x="' + (cx + 30) + '" y="18" font-size="9" fill="#8ba0b3">7 天</text>' +
      '<text x="' + (cx + 30) + '" y="30" font-size="10.5" font-weight="800" fill="' + DEEP + '">37%</text>';
  };

  /* B15 滑轨 + 游标 */
  const b15 = () => {
    const x = 6 + 84 * PCT / 100;
    return '<line x1="6" y1="20" x2="90" y2="20" stroke="' + PALE + '" stroke-width="8" stroke-linecap="round"/>' +
      '<line x1="6" y1="20" x2="' + x.toFixed(1) + '" y2="20" stroke="' + DEEP + '" stroke-width="8" stroke-linecap="round"/>' +
      '<circle cx="' + x.toFixed(1) + '" cy="20" r="6.5" fill="#fff" stroke="' + DEEP + '" stroke-width="3"/>' +
      '<text x="' + x.toFixed(1) + '" y="37" text-anchor="middle" font-size="9" font-weight="700" fill="' + DEEP + '">37%</text>';
  };

  /* B16 柱 + 底部进度条 */
  const b16 = () => {
    const max = Math.max.apply(null, DAYS.map(Math.abs));
    const bars = DAYS.map((v, i) => {
      const h = Math.max(5, Math.round(Math.abs(v) / max * 16) + 3);
      return '<rect x="' + (i * 13.5) + '" y="' + (24 - h) + '" width="9" height="' + h + '" rx="2" fill="' + (v >= 0 ? DEEP : LIGHT) + '"/>';
    }).join('');
    const a = 94 * PCT / 100;
    return bars + '<rect x="1" y="30" width="94" height="7" rx="3.5" fill="' + PALE + '"/>' +
      '<rect x="1" y="30" width="' + a.toFixed(1) + '" height="7" rx="3.5" fill="' + DEEP + '"/>';
  };

  /* B17 7 段色阶 */
  const b17 = () => P7.map((v, i) => {
    const c = v >= 50 ? DEEP : v >= 37 ? MID : LIGHT;
    return '<rect x="' + (i * 13.5) + '" y="6" width="10" height="28" rx="3" fill="' + c + '"/>';
  }).join('');

  /* B18 环形 7 段 */
  const b18 = () => {
    const cx = 20, cy = 20, r = 15;
    let out = '';
    for (let i = 0; i < 7; i++) {
      const a0 = Math.PI * 2 * i / 7 - Math.PI / 2, a1 = Math.PI * 2 * (i + 0.8) / 7 - Math.PI / 2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      out += '<path d="M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + r + ' ' + r + ' 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + '" fill="none" stroke="' + (DAYS[i] >= 0 ? DEEP : LIGHT) + '" stroke-width="5.5" stroke-linecap="round"/>';
    }
    return out + '<text x="44" y="24" font-size="13" font-weight="800" fill="' + DEEP + '">37%</text>';
  };

  /* B19 大数字 + 箭头 */
  const b19 = () => {
    return '<text x="0" y="30" font-size="27" font-weight="800" fill="' + DEEP + '">37</text>' +
      '<text x="34" y="26" font-size="13" font-weight="800" fill="' + DEEP + '">%</text>' +
      '<path d="M48 30 L86 12" stroke="' + MID + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
      '<path d="M76 11 L86 11 L86 21" stroke="' + MID + '" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  };

  /* B20 瀑布 */
  const b20 = () => {
    let base = 34, out = '';
    DAYS.forEach((v, i) => {
      const h = Math.abs(v) / 1.33 * 12 + 4;
      if (v >= 0) { base -= h; out += '<rect x="' + (i * 13.5) + '" y="' + base.toFixed(1) + '" width="10" height="' + h.toFixed(1) + '" rx="2" fill="' + DEEP + '"/>'; }
      else { out += '<rect x="' + (i * 13.5) + '" y="' + base.toFixed(1) + '" width="10" height="' + h.toFixed(1) + '" rx="2" fill="' + LIGHT + '"/>'; base += h; }
    });
    return out;
  };

  const SET = [
    ['B01', '7 根柱（现状）', '每个交易日一根，高=当日涨跌。数字 37% 只在文字里，图上看不出来。', b01()],
    ['B02', '圆环进度 + 中心 37%', '最直观：环形填满 37%，中心写数字，右侧补「63% 下跌」。', b02()],
    ['B03', '十格分段条', '10 格填 4 格（37% 进到第 4 格），像素感强、不占高度。', b03()],
    ['B04', '点阵 10×4（37 个实心）', '100 个点里点亮 37 个，最「诚实」的比例表达。', b04()],
    ['B05', '7 根双段柱 + 37% 虚线', '柱内上段是当天上涨占比，虚线标出近一周均值 37%。', b05()],
    ['B06', '半环仪表', '像车速表，指针位置即 37%，适合卡片左侧窄条。', b06()],
    ['B07', '液位瓶', '竖着的「水位」= 上涨占比，数字写在液面上。', b07()],
    ['B08', '折线 + 面积', '7 天上涨占比的走势，末端点点在 37%。', b08()],
    ['B09', '日涨跌柱 + 37% 参考线', '柱子沿用现状，加一条 37% 虚线并把数字做成标签，兼顾两种信息。', b09()],
    ['B10', '横向双段条（37 / 63）', '一段实、一段虚，数字写在两段里，最省文字说明。', b10()],
    ['B11', '小饼图', '经典 37/63 饼图，中心留白写数字。', b11()],
    ['B12', '7 个圆点（实心=涨）', '每天一个点，实心是涨、空心是跌，大小表示幅度；不加数字也能看出「多数在涨」。', b12()],
    ['B13', '阶梯线（每日占比）', '像台阶一样逐日变化，末端落在 37%。', b13()],
    ['B14', '环 + 7 天刻度点', '环是 37% 的进度，环外 7 个点是这 7 天各自的涨跌（深=涨）。', b14()],
    ['B15', '滑轨 + 游标', '一条滑轨，游标停在 37%，两端标 0/100。', b15()],
    ['B16', '柱 + 角标文字', '保留 7 根柱，底下加一行「近一周 37% 上涨」做呼应。', b16()],
    ['B17', '7 段色阶方块', '每天一块，颜色深浅表示当天上涨占比高低，整体一眼看出冷暖。', b17()],
    ['B18', '环形 7 段', '环形切成 7 段代表 7 天，亮起的是上涨天数。', b18()],
    ['B19', '大数字 + 箭头', '把 37% 做成主角（26px），配一支上行箭头，最像「标题」。', b19()],
    ['B20', '瀑布（每日累积）', '按每天涨跌上下台阶，看得出这一周是「涨上去又回落」。', b20()],
  ];

  document.getElementById('list').innerHTML = SET.map(([id, name, desc, art]) =>
    '<section class="cell"><div class="cap"><b>' + id + '</b><span>' + name + '</span></div>' +
    '<div class="demo"><div class="card">' +
      '<span class="art">' + svg(art) + '</span>' +
      '<span class="tx"><b>近日 <i>37%</i> 的基金上涨</b><em>最近一周 · 每日更新</em></span>' +
      '<span class="go">看看是哪些 →</span>' +
    '</div></div></section>').join('');
})();
</script>
</body>
</html>
