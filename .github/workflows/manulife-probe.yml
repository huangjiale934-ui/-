name: manulife-probe

# 宏利净值发布时点探测（2026-11-10 建立）
# 目的：宏利 API 只给 asOfDate，没有发布时间。用高频采样反推「每天几点几分上线」。
# 运行在 GitHub 云端，不占用本机、不消耗 WorkBuddy 积分（公开仓库 Actions 免费）。
# 每天五段：23:00–03:00 / 03:00–07:00 / 07:00–11:00 / 13:00–17:00 / 18:00–22:00（香港时间），
# 5 分钟一次。留 11–13、17–18、22–23 三个短空档，其余基本全天覆盖（含跨夜发布）。
# 2026-11-11：原 330 分钟窗口 + 350 分钟超时，实测会卡到超时来不及提交（11-11 07:27 那班）。
# 缩短为 180 分钟 + 240 分钟超时，保证每班都能把采样记录提交回来。
on:
  # 探测期已结束，保留手动触发和代码改动自测，不再占用定时任务队列。
  workflow_dispatch:
    inputs:
      minutes:
        description: '本次连续采样时长（分钟）'
        default: '240'
      interval:
        description: '采样间隔（分钟）'
        default: '5'
  push:
    # 首次上线自测：改动本文件或脚本时自动跑一次单点采样，验证云端能否访问宏利 API
    paths:
      - '.github/workflows/manulife-probe.yml'
      - 'tools/manulife-probe.py'

permissions:
  contents: write

# 2026-11-16：去掉并发组。原来单班 4 小时，必须串行；现在每班约 40 秒，
# 偶发重叠无副作用（两次都只是追加样本，提交有 3 次重试）。
# 保留并发组反而会被「已取消但仍在收尾」的长作业自锁——11-16 11:50 那班就排队 25 分钟没启动。

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip -q
          pip install -q curl_cffi

      - name: 採樣
        run: |
          # 探测期：到 2026-11-23 为止（用户要求延长一周）
          if [ "$(date -u +%Y%m%d)" -gt 20261123 ]; then
            echo "探测期已结束（2026-11-23），跳过采样"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/manulife-probe.py --minutes "${{ inputs.minutes }}" --interval "${{ inputs.interval }}" --codes SHK122
          else
            python tools/manulife-probe.py --once --codes SHK122
          fi

      - name: 寫入運行摘要
        if: always()
        run: |
          if [ -f data/probe/manulife-summary.json ]; then
            {
              echo '### 宏利发布窗口（最近采样）'
              echo '```json'
              python -c "import json;d=json.load(open('data/probe/manulife-summary.json',encoding='utf-8'));print(json.dumps({k:{'stats':v['stats'],'last':v['transitions'][-1] if v['transitions'] else None} for k,v in d['funds'].items()},ensure_ascii=False,indent=1))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 2026-11-16：并发/推送被拒时样本只留在日志里（11-15、11-16 两班即如此）。
      # 增加 artifact 兜底：无论回写是否成功，采样文件都可下载，不会再丢。
      - name: 保存採樣記錄（artifact 兜底）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manulife-probe-${{ github.run_id }}
          path: data/probe/
          retention-days: 7

      - name: 提交探測記錄
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add data/probe 2>/dev/null || true
          # 每 30 分钟一次会产生 48 条/天，没必要全部进 git：
          # 只有「summary 出现新发布节点」或「当天还没有提交」时才提交，其余样本留在 artifact。
          TODAY=$(date +%F)
          LAST=$(git log -1 --format=%cs -- data/probe 2>/dev/null || echo none)
          SUMMARY_CHANGED=1
          git diff --cached --quiet -- data/probe/manulife-summary.json && SUMMARY_CHANGED=0
          if [ "$SUMMARY_CHANGED" = "0" ] && [ "$LAST" = "$TODAY" ]; then
            echo "无新发布节点，样本保留在 artifact（今日已提交过）"
            exit 0
          fi
          # [skip ci]：探测记录不触发 Pages 部署，避免每天多出两次无意义的站点构建
          git commit -m "chore(probe): 宏利发布时点采样 $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "推送成功（第 $i 次）"; exit 0; fi
            echo "推送被拒，rebase 后重试…"
            git fetch origin main || true
            git rebase --autostash origin/main || git rebase --abort || true
            sleep 5
          done
          echo "!! 采样记录回写失败（数据仍在运行日志中，不影响探测）"
