name: schedule-probe

# 2026-10-27 诊断用：单独一个极轻量工作流，用 10 分钟粒度验证「本仓库的 schedule 触发器到底能不能被 GitHub 唤起」。
# 背景：deploy.yml 自建仓（2026-10-25 13:16 UTC）以来，schedule 一次都没触发过，近 30 次运行全部是 push 事件。
# 判定：
#   · 若本文件在 10–20 分钟内产生 schedule 运行 → 调度器正常，问题在 deploy.yml 的注册状态（重新登记即可）
#   · 若始终不触发 → 该仓库/账号侧的 schedule 不可用，只能走 PAT + 外部定时器（workflow_dispatch）
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 打印触发信息
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "UTC 时间: $(date -u '+%F %T')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%F %T')"
