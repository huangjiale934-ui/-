name: deploy

# push 到 main 即構建並部署 GitHub Pages；
# 每日北京 22:40（UTC 14:40）跑一次數據更新（抓取 → 校驗 → commit → 觸發部署）。
# 2026-10-28：本機鏈路改為「不推 GitHub」，雲端成為 GitHub 側唯一寫手，
#             兩站各自獨立更新；提交信息含 [run-data] 可手動觸發一次數據更新。
on:
  push:
    branches: [main]
  schedule:
    # 每天北京 22:40 = UTC 14:40（週末官網無新數據時 commit 為空、不重複發布，無害）
    - cron: '40 14 * * *'
    # 2026-10-28：交易日北京 09:45 = UTC 01:45（与本机 09:40 错开 5 分钟，避免同时打同一批官网），只更新「淨值 + 自算指標」，不动指数/新闻/持仓/积金局档案
    - cron: '45 1 * * 1-5'
    # 2026-11-11（用户反馈：宏利常在下午发布，等到 22:40 才更新会慢一天）：
    # 交易日北京 17:10 = UTC 09:10，再跑一次轻量更新，把当天下午发布的净值当天补上。
    - cron: '10 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 2026-10-27 修：原来 cancel-in-progress: true 且所有事件共用 pages 组 ——
  # 只要定时任务与 push 触发的构建撞在一起，定时任务会被直接取消。
  # 实测：2026-10-26 15:50:48Z 的 schedule 运行结论就是 cancelled（当时正好有一次 push 构建）。
  # 改为不取消、排队执行：push 构建最多多等几分钟，但定时数据更新不会再被吃掉。
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    # 排程 / 手动触发才抓数据；push 触发的构建跳过（数据已在 commit 里）。
    # 例外：提交信息带 [run-data] 时也跑一次，用于手动验证云端抓取链路。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-data]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝抓取依賴
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi PyMuPDF pdfplumber requests pypdf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 確認無頭瀏覽器可用（官網快照必需）
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "runner 未自带 Chrome，安装 chromium…"
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            (command -v chromium-browser || command -v chromium) && echo "ok"
          fi

      - name: 判定更新模式（全量 / 仅净值）
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "45 1 * * 1-5" ] || [ "${{ github.event.schedule }}" = "10 9 * * 1-5" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "light=1" >> "$GITHUB_OUTPUT"
            echo "本次为「仅净值」模式（北京时间交易日 09:40）"
          else
            echo "light=0" >> "$GITHUB_OUTPUT"
            echo "本次为「全量」模式"
          fi

      - name: 抓取發行人官網數據（失敗保留舊數據）
        if: steps.mode.outputs.light == '0'
        run: |
          # 2026-10-28：hist 快照——发行人脚本多为「整段覆盖写」，用 --from 只抓近端区间时
          # 会把 2015 年以来的历史冲成 5 个点（云端 10-28 就把 74 只基金冲成了 5 点）。
          # 抓取前备份、抓取后按日期取并集，才是正确姿势。
          node tools/hist-merge-snap.js save
          # 2026-10-26：持仓写入事务——抓取前快照，写后自动判定退化并回滚（与本机 daily.sh 同口径）
          node tools/holdings-txn.js save
          # 逐渠道軟失敗：單渠道失敗只記錄，不中斷（與本機 daily.sh 同哲學）
          # 2026-10-28：与本机同样加硬超时——某些发行人页面会让无头浏览器挂住，
          # 云端 job 上限 90 分钟，一旦挂住整条链就等于今天没更新。
          timeout 1500 node navbuild.js --render || echo "!! navbuild 官網快照失敗"
          python fetch-manulife-hist.py || echo "!! 宏利失敗"
          python nav-etnet.py || echo "!! etnet 失敗"
          python fetch-bea-hist.py || echo "!! 東亞失敗"
          python fetch-fidelity-hist.py || echo "!! 富達失敗"
          python ht_daily.py || echo "!! 海通失敗"
          python fetch-bocom-hist.py || echo "!! 交通失敗"
          python fetch-sunlife-hist.py || echo "!! 永明失敗"
          python fetch-chinalife-hist.py || echo "!! 中國人壽失敗"
          python fetch-hsbc-family.py --from "$(date -d '10 days ago' +%F)" || echo "!! 滙豐/恒生失敗"
          python fetch-bocpt-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 中銀保誠失敗"
          python aia_ingest2.py || echo "!! 友邦失敗"
          python fetch-shkp-hist.py || echo "!! 新地失敗"
          python yflife_daily.py || echo "!! 萬通失敗"
          python news_fetch.py || echo "!! 積金局新聞稿失敗"
          python tools/bct-recent.py || echo "!! BCT 失敗"

      - name: 抓取淨值（交易日 09:40 / 17:10 轻量模式）
        if: steps.mode.outputs.light == '1'
        run: |
          node tools/mpfa-refresh.js || echo "!! 積金局快照刷新失敗（保留舊數據）"
          # 2026-10-28：抓取前备份 hist（本次多为「近端区间覆盖写」，合并时按日期取并集）
          node tools/hist-merge-snap.js save
          # 只抓「單位淨值」渠道；不跑指数、新闻、持仓解析、积金局档案
          # 2026-10-28：与本机同样加硬超时——某些发行人页面会让无头浏览器挂住，
          # 云端 job 上限 90 分钟，一旦挂住整条链就等于今天没更新。
          timeout 1500 node navbuild.js --render || echo "!! navbuild 官網快照失敗"
          python fetch-manulife-hist.py || echo "!! 宏利失敗"
          python fetch-bea-hist.py || echo "!! 東亞失敗"
          python fetch-fidelity-hist.py || echo "!! 富達失敗"
          python fetch-sunlife-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 永明失敗"
          python fetch-hsbc-family.py --from "$(date -d '10 days ago' +%F)" || echo "!! 滙豐/恒生失敗"
          python fetch-bocpt-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 中銀保誠失敗"
          python fetch-bocom-hist.py || echo "!! 交通失敗"
          python fetch-chinalife-hist.py || echo "!! 中國人壽失敗"
          python aia_ingest2.py || echo "!! 友邦失敗"
          python fetch-shkp-hist.py || echo "!! 新地失敗"
          python yflife_daily.py || echo "!! 萬通失敗"
          python ht_daily.py || echo "!! 海通失敗"
          python tools/bct-recent.py || echo "!! BCT 失敗"

      - name: 積金局月度業績（每月 5 號後官方更新；失敗保留舊數據）
        if: steps.mode.outputs.light == '0'
        run: node scraper.js || echo "!! 積金局抓取失敗（保留舊 dataAsOf）"

      - name: 近 5 個交易日淨值複核（官網重比對，偏差自動修正）
        # 2026-11-04：源站偶發錯價（BCT 10-30 曾報高 4.2%）——每日對最近 5 個交易日逐只重抓，
        # 偏差 >0.2% 自動改正並寫 data/nav-recheck.log；後面的 navperf 會重算受影響的指標。
        run: python tools/nav-recheck.py --apply || echo "!! 淨值複核失敗（不影響已抓到的最新值）"

      - name: 重算指標與校驗
        run: |
          # 2026-10-28：先做 hist 并集合并（快照 ∪ 本次新值），再算指标——
          # 顺序不能反，否则算出来的 ytd/mdd 是建立在被截断的 5 个点上。
          node tools/hist-merge-snap.js merge
          # 2026-11-11（自查发现）：積金局基金資訊表字段（规模/年率化/风险）此前只有本机
          # 手工跑 build.js 才会更新，云端与本机都停在 09-30。这里按 cfid 外科式合并，
          # 只覆盖積金局口径字段（保护 nav/navAsOf），官网日期倒退时自动跳过。
          if [ "${{ steps.mode.outputs.light }}" = "0" ]; then node tools/mpfa-refresh.js || echo "!! 積金局快照刷新失敗（保留舊數據）"; fi
          node navperf.js
          # 2026-11-11（用户反馈两站数据不一致）：原来只有 22:40 全量跑 indexbuild，
          # 白天 09:45 的轻量任务不更新市场指数 → GitHub 站的恒指/标普在白天比
          # WorkBuddy 站晚一天（11-09 vs 11-10）。指数只取一次行情接口，成本很低。
          node indexbuild.js || echo "!! 市場指數失敗（保留舊數據）"
          node tools/fix-nulls.js
          node tools/merge-nav.js
          # 2026-10-29 修：merge-nav 会把「官方当日净值」追加进 data/hist/<id>.json，
          # 而 navperf 已在上面跑过 → 自算指标停在被追加前的末点。
          # 实测 10-28 云端 16 只 AMTD 的 asOf 停在 10-23（净值已 10-26），
          # 与 WorkBuddy 站相比「更新更少」就是这里造成的。追加后必须再算一遍。
          node navperf.js
          # 2026-10-29 修：merge-nav 只写 hist 文件、不更新 hist-index.json，
          # 云端没有第二个人补索引 → 索引长期落后（10-28 有 25 只：AMTD 16 + 宏利退休精選 9）。
          node tools/hist-index-sync.js
          # 2026-11-11（用户反馈两站数据不一致，根因）：云端从未调用过 mpfindex.js，
          # 自算的 MPF 市场/股票/混合/债券指数一直冻结在上一次提交的日期（实测 11-04），
          # 而本机每天两次重算（11-09）→ 两站顶部行情条差 5 天。
          # mpfindex 只读 data/hist + funds + holdings，纯 JS，几十毫秒。
          node mpfindex.js || echo "!! 自算指數失敗（保留舊數據）"
          # 2026-11-11：走势图「未选基金」统计表数据源，必须与最新净值日同步
          node allstats.js || echo "!! 區間統計失敗（保留舊數據）"
          # 2026-10-26：先判定持仓是否退化（退化则整档回滚），再做规范化与守卫——
          # 避免「坏数据已落盘、守卫只告警」的旧问题在云端复现
          if [ "${{ steps.mode.outputs.light }}" = "0" ]; then
            node tools/holdings-txn.js check --restore || echo "!! 檢測到持倉退化，已回滾到抓取前快照"
            node tools/holdings-normalize.js
            node tools/holdings-guard.js
          fi
          # 2026-10-28：校验类步骤改为「告警不阻断」——10-28 10:41 的定时任务就是因为
          # 三处一致性巡检返回 1 直接整条 run 失败，连 Pages 都没发布出去。
          # 数据本身有防退化守卫兜底，发布上一次完整数据比「什么都不发」更安全。
          node tools/nav-consistency.js || echo "!! nav-consistency 未通过（不影响发布）"
          # 2026-10-26 修 4-05：补齐本机 health-check 覆盖的四类哨兵（缺日/渠道一致/allocSum/三处一致本地版）
          node tools/gap-check.js || echo "!! gap-check 有缺口（不影响发布）"
          node tools/health-check.js --local || echo "!! health-check 有告警（不影响发布）"

      - name: 官網快照自檢（雲端必須真的抓到頁面）
        continue-on-error: true
        run: |
          node -e "
          const n=require('./data/nav.json');
          const src=n.sources||[];
          const all=src.length;
          const ok=src.filter(s=>s.count>0).length;
          const carried=src.filter(s=>s.carried).length;
          const alerts=(n.alerts||[]).length;
          const line='官網來源有數據 '+ok+' / '+all+'；沿用上次 '+carried+' 個來源；告警 '+alerts+' 条；nav.updatedAt '+new Date(n.updatedAt).toISOString();
          console.log(line);
          try{ if(process.env.GITHUB_STEP_SUMMARY){require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### 官網快照自檢\n\n'+line+'\n');} }catch(e){}
          if(!ok){ console.error('!! 官網快照 0 條：Chrome 渲染失敗或官網訪問被攔'); process.exit(1); }
          if(carried > all/2){ console.error('!! 超過半數來源沿用舊數據：雲端渲染大面積失敗，GitHub 站淨值不會刷新'); process.exit(1); }
          "

      - name: 提交數據變更
        # 2026-10-28：本机每日 23:20 也会推一次数据，云端与本机同时提交同一批文件时 rebase 会冲突，
        # 曾导致整个 run 在「提交」这一步失败（10:41 的定时任务就是这样挂的，站点没发布）。
        # 现在：冲突时以「本次运行抓到的数据」为准继续 rebase；仍失败只告警，不阻断后续构建发布。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "數據無變更"
            exit 0
          fi
          git commit -m "daily data update $(date -u +%F)"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; echo "推送成功（第 $i 次）"; break; fi
            echo "推送被拒（第 $i 次），rebase 后重试…"
            git fetch origin main || true
            if ! git rebase origin/main; then
              # 冲突文件一律采用本次运行抓到的版本（rebase 中 theirs = 本地提交）
              git checkout --theirs -- data 2>/dev/null || true
              git add data 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "!! 数据回写失败（不影响本次站点发布，本机 nightly 仍会推送）"
          fi

  build-deploy:
    runs-on: ubuntu-latest
    needs: [update-data]
    if: always() && !failure() && !cancelled()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 重算自算指數（每次構建都用当前 hist 重算，避免任何触发方式留下舊值）
        run: |
          node mpfindex.js || echo "!! 自算指數失敗（沿用倉庫數據）"

      - name: 靜態化構建
        run: node tools/build-static.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
