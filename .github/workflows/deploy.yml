name: deploy

# push 到 main 即構建並部署 GitHub Pages；
# 每日香港 01:40（UTC 17:40）跑一次全量資料更新（抓取 → 校驗 → 季度持倉 → commit → 觸發部署）；
# 香港 04:30（UTC 20:30）再跑一次全量重試，避免官網晚發布或 GitHub 排隊造成漏更；
# 工作日 09:00（UTC 01:00）跑一次僅淨值的輕量班。GitHub 定時觸發實測延遲 5.5–8 小時。
# 2026-10-28：本機鏈路改為「不推 GitHub」，雲端成為 GitHub 側唯一寫手，
#             兩站各自獨立更新；提交信息含 [run-data] 可手動觸發一次數據更新。
#             注意：正文里出现该标记也算（11-23 一次提交说明引用它，误触发了一次全量班），
#             写 commit message 时不要把它当普通词汇引用。
on:
  push:
    branches: [main]
  schedule:
    # 全量班可配置两条 cron（发布后首跑 + 重试），并必须带一条 `# light` 标记：
    # 「判定更新模式」那一步直接从本文件读标记，不再手写第二份 cron 字符串。
    # 历史事故（2026-11-21）：schedule 已改成 0 16，判定里还比着旧的 40 14 →
    # 11-21 起每一次全量班都被判成轻量，scraper/持仓/indexbuild/allstats 在云端从未执行。
    # 现在只有「改 cron 且忘了改标记」才会出问题，而那种情况会直接让 job 失败（不会静默降级）。
    - cron: '40 17 * * *'  # full   01:40 HKT 全量（净值 + 持仓 + 指数 + 季度）
    - cron: '30 20 * * *'  # full   04:30 HKT 全量重試（晚發布／排隊兜底）
    - cron: '0 1 * * 1-5'  # light  09:00 HKT 仅净值（工作日）
  workflow_dispatch:
    inputs:
      mode:
        description: '更新模式（full = 全量，light = 仅净值）'
        type: choice
        options: [full, light]
        default: full
      quarterly:
        description: '季度持仓（auto = 按季度计划日判定，force = 强制跑一次，用于验证链路）'
        type: choice
        options: [auto, force]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    concurrency:
      group: mpf-data
      cancel-in-progress: false
    # 排程 / 手动触发才抓数据；push 触发的构建跳过（数据已在 commit 里）。
    # 例外：提交信息带 [run-data] 时也跑一次（= 手动全量），用于验证云端抓取链路。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-data]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # 供 quarterly job 判断「本次是否为全量班」
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝抓取依賴
        run: |
          python -m pip install --upgrade pip
          # 2026-11-13（第三方核验 E7）：锁定次版本区间，避免某天上游发新版把云端抓取打断；
          # 区间而不是硬钉版本，是为了还能吃到安全补丁。
          pip install 'curl_cffi>=0.16,<0.17' 'PyMuPDF>=1.26,<3' 'pdfplumber>=0.11,<0.12' 'requests>=2.32,<3' 'pypdf>=6,<7'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 確認無頭瀏覽器可用（官網快照必需）
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "runner 未自带 Chrome，安装 chromium…"
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            (command -v chromium-browser || command -v chromium) && echo "ok"
          fi

      - name: 判定更新模式（全量 / 轻量）
        id: mode
        env:
          EV_NAME: ${{ github.event_name }}
          EV_SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -u
          WF=".github/workflows/deploy.yml"
          # 唯一事实来源：本文件 schedule 里带 `# full` 的首跑／重试行及 `# light` 行。
          # 绝不在这里再写一遍 cron 字面量（11-21 事故就是这么来的）。
          FULL_CRONS=$(grep -oE "cron: *'[^']+' *# *full" "$WF" | sed -E "s/^.*cron: *'([^']+)'.*/\1/" || true)
          LIGHT_CRON=$(grep -oE "cron: *'[^']+' *# *light" "$WF" | head -1 | sed -E "s/^.*cron: *'([^']+)'.*/\1/" || true)
          N_FULL=$(printf '%s\n' "$FULL_CRONS" | sed '/^$/d' | wc -l)
          N_LIGHT=$(grep -cE "cron: *'[^']+' *# *light" "$WF" || true)
          N_CRON=$(grep -cE "^[[:space:]]*-[[:space:]]*cron:" "$WF" || true)
          if [ "$N_FULL" -lt 1 ] || [ "$N_LIGHT" != "1" ]; then
            echo "::error::schedule 必须至少一条 '# full' cron 和恰好一条 '# light' cron；当前 cron=${N_CRON:-0} 条，full=${N_FULL} light=${N_LIGHT}"
            exit 1
          fi

          case "$EV_NAME" in
            workflow_dispatch) MODE="${IN_MODE:-full}" ;;
            push)              MODE=full ;;   # 只有带 [run-data] 的提交才会进本 job = 手动全量
            schedule)
              MODE=
              while IFS= read -r FULL_CRON; do
                [ -n "$FULL_CRON" ] && [ "$EV_SCHED" = "$FULL_CRON" ] && MODE=full
              done <<< "$FULL_CRONS"
              if [ -z "$MODE" ] && [ "$EV_SCHED" = "$LIGHT_CRON" ]; then MODE=light; fi
              if [ -z "$MODE" ]; then echo "::error::未知的 schedule '$EV_SCHED'（不是本文件里的任何一条 cron）"; exit 1; fi ;;
            *)                 MODE=light ;;
          esac

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "full" ]; then echo "light=0" >> "$GITHUB_OUTPUT"; else echo "light=1" >> "$GITHUB_OUTPUT"; fi
          echo "本次模式：$MODE ｜ 触发=$EV_NAME ｜ 命中 cron=${EV_SCHED:-无} ｜ full=$FULL_CRON light=$LIGHT_CRON"
          {
            echo "### 本次更新模式"
            echo "| 模式 | 触发 | 命中 cron | 全量 cron |"
            echo "| --- | --- | --- | --- |"
            echo "| **$MODE** | $EV_NAME | ${EV_SCHED:-—} | $FULL_CRON |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 抓取發行人官網數據（失敗保留舊數據）
        if: steps.mode.outputs.light == '0'
        run: |
          # 2026-10-28：hist 快照——发行人脚本多为「整段覆盖写」，用 --from 只抓近端区间时
          # 会把 2015 年以来的历史冲成 5 个点（云端 10-28 就把 74 只基金冲成了 5 点）。
          # 抓取前备份、抓取后按日期取并集，才是正确姿势。
          node tools/hist-merge-snap.js save
          # 2026-10-26：持仓写入事务——抓取前快照，写后自动判定退化并回滚（与本机 daily.sh 同口径）
          node tools/holdings-txn.js save
          # 逐渠道軟失敗：單渠道失敗只記錄，不中斷（與本機 daily.sh 同哲學）
          # 2026-10-28：与本机同样加硬超时——某些发行人页面会让无头浏览器挂住，
          # 云端 job 上限 90 分钟，一旦挂住整条链就等于今天没更新。
          timeout 1500 node navbuild.js --render-only || echo "!! navbuild 官網快照失敗"
          node navbuild.js || echo "!! navbuild 解析失敗"
          # 2026-11-22：節點級抓取監控（源站改版單獨告警，不阻斷）
          node tools/scrape-health.js || true
          timeout 900 python fetch-manulife-hist.py || echo "!! 宏利失敗"
          timeout 900 python nav-etnet.py || echo "!! etnet 失敗"
          timeout 900 python fetch-bea-hist.py || echo "!! 東亞失敗"
          timeout 900 python fetch-fidelity-hist.py || echo "!! 富達失敗"
          timeout 900 python ht_daily.py || echo "!! 海通失敗"
          timeout 900 python fetch-bocom-hist.py || echo "!! 交通失敗"
          timeout 900 python fetch-sunlife-hist.py --from "$(date -d '45 days ago' +%F)" || echo "!! 永明失敗"
          timeout 900 python fetch-chinalife-hist.py || echo "!! 中國人壽失敗"
          timeout 900 python fetch-hsbc-family.py --from "$(date -d '10 days ago' +%F)" || echo "!! 滙豐/恒生失敗"
          timeout 900 python fetch-bocpt-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 中銀保誠失敗"
          timeout 900 python aia_ingest2.py || echo "!! 友邦失敗"
          timeout 900 python fetch-shkp-hist.py || echo "!! 新地失敗"
          # 2026-11-12：官網 PDF 路徑帶 %20 被 WAF 返 999（非撤檔），改用發行人指定的 HKET 每日價格
          timeout 900 python tools/shkp-hket.py || echo "!! 新地 HKET 兜底失敗"
          timeout 900 python yflife_daily.py || echo "!! 萬通失敗"
          timeout 900 python news_fetch.py || echo "!! 積金局新聞稿失敗"
          timeout 900 python tools/bct-recent.py || echo "!! BCT 失敗"

      - name: 抓取淨值（交易日 09:00 轻量模式）
        if: steps.mode.outputs.light == '1'
        run: |
          node tools/mpfa-refresh.js || echo "!! 積金局快照刷新失敗（保留舊數據）"
          # 2026-10-28：抓取前备份 hist（本次多为「近端区间覆盖写」，合并时按日期取并集）
          node tools/hist-merge-snap.js save
          # 只抓「單位淨值」渠道；不跑指数、新闻、持仓解析、积金局档案
          # 2026-10-28：与本机同样加硬超时——某些发行人页面会让无头浏览器挂住，
          # 云端 job 上限 90 分钟，一旦挂住整条链就等于今天没更新。
          timeout 1500 node navbuild.js --render-only || echo "!! navbuild 官網快照失敗"
          node navbuild.js || echo "!! navbuild 解析失敗"
          # 2026-11-22：節點級抓取監控（源站改版單獨告警，不阻斷）
          node tools/scrape-health.js || true
          timeout 900 python fetch-manulife-hist.py || echo "!! 宏利失敗"
          timeout 900 python fetch-bea-hist.py || echo "!! 東亞失敗"
          timeout 900 python fetch-fidelity-hist.py || echo "!! 富達失敗"
          timeout 900 python fetch-sunlife-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 永明失敗"
          timeout 900 python fetch-hsbc-family.py --from "$(date -d '10 days ago' +%F)" || echo "!! 滙豐/恒生失敗"
          timeout 900 python fetch-bocpt-hist.py --from "$(date -d '10 days ago' +%F)" || echo "!! 中銀保誠失敗"
          timeout 900 python fetch-bocom-hist.py || echo "!! 交通失敗"
          timeout 900 python fetch-chinalife-hist.py || echo "!! 中國人壽失敗"
          timeout 900 python aia_ingest2.py || echo "!! 友邦失敗"
          timeout 900 python fetch-shkp-hist.py || echo "!! 新地失敗"
          # 2026-11-12：官網 PDF 路徑帶 %20 被 WAF 返 999（非撤檔），改用發行人指定的 HKET 每日價格
          timeout 900 python tools/shkp-hket.py || echo "!! 新地 HKET 兜底失敗"
          timeout 900 python yflife_daily.py || echo "!! 萬通失敗"
          timeout 900 python ht_daily.py || echo "!! 海通失敗"
          timeout 900 python tools/bct-recent.py || echo "!! BCT 失敗"

      # 2026-11-16（用户反馈 1525/1528 停在 11-10）：列表页对个别基金滞後，
      # 逐只查 fundhistory（3 次重试，取最新节点），只在官方更晚时追加。
      - name: 宏利最新點補齊（逐只 fundhistory）
        run: python tools/manulife-latest.py || echo "!! 宏利補點失敗（不影響已抓到數據）"
      # 2026-11-16：同计划内落后监控（按 scheme 取当天最大值，逐只比较）
      - name: 同計劃內落後監控
        run: node tools/plan-lag.js || echo "!! 落後監控失敗（不影響數據）"

      - name: 積金局基金資訊表（scraper；失敗保留舊 dataAsOf）
        if: steps.mode.outputs.light == '0'
        run: node scraper.js || echo "!! 積金局抓取失敗（保留舊 dataAsOf）"

      # 2026-11-23（用户要求）：狀態漂移（na / unmatched 集合與上一班比較），只記錄不阻斷
      - name: 狀態漂移（na / unmatched）
        run: node tools/status-drift.js || true

      # 2026-11-11（用户要求自动化）：月度統計表在新聞稿裡是**圖片**，用 OCR 解析。
      # 官方 6 日前後發佈，所以只在每月 1–12 日跑；OCR 校驗不通過就保留舊資料。
      - name: 積金局月度統計（OCR，1–12 日）
        if: steps.mode.outputs.light == '0'
        run: |
          if [ "$(date -u +%d)" -le 12 ]; then
            python -m pip install -q 'rapidocr-onnxruntime>=1.2,<1.4' 2>/dev/null || echo "!! OCR 依賴安裝失敗"
          timeout 900 python tools/mpfa-monthly-sync.py || echo "!! 月度統計未更新（保留舊數據）"
          else
            echo "非月初窗口，跳過月度統計"
          fi

      - name: 近 5 個交易日淨值複核（官網重比對，偏差自動修正）
        # 2026-11-04：源站偶發錯價（BCT 10-30 曾報高 4.2%）——每日對最近 5 個交易日逐只重抓，
        # 偏差 >0.2% 自動改正並寫 data/nav-recheck.log；後面的 navperf 會重算受影響的指標。
        run: python tools/nav-recheck.py --apply || echo "!! 淨值複核失敗（不影響已抓到的最新值）"

      - name: 雅虎補空（官網未發布時先用雅虎同源淨值）
        run: node tools/yahoo-fill.js || echo "!! 雅虎補空失敗（不影響已抓到的最新值）"

      - name: 歷史淨值統一 4 位（2026-11-17）
        run: node tools/hist-round4.js

      - name: 重算指標與校驗
        run: |
          # 2026-10-28：先做 hist 并集合并（快照 ∪ 本次新值），再算指标——
          # 顺序不能反，否则算出来的 ytd/mdd 是建立在被截断的 5 个点上。
          node tools/hist-merge-snap.js merge
          # 2026-11-11（自查发现）：積金局基金資訊表字段（规模/年率化/风险）此前只有本机
          # 手工跑 build.js 才会更新，云端与本机都停在 09-30。这里按 cfid 外科式合并，
          # 只覆盖積金局口径字段（保护 nav/navAsOf），官网日期倒退时自动跳过。
          if [ "${{ steps.mode.outputs.light }}" = "0" ]; then node tools/mpfa-refresh.js || echo "!! 積金局快照刷新失敗（保留舊數據）"; fi
          node navperf.js
          # 2026-11-11（用户反馈两站数据不一致）：原来只有全量班跑 indexbuild，
          # 白天 09:45 的轻量任务不更新市场指数 → GitHub 站的恒指/标普在白天比
          # WorkBuddy 站晚一天（11-09 vs 11-10）。指数只取一次行情接口，成本很低。
          node indexbuild.js || echo "!! 市場指數失敗（保留舊數據）"
          node tools/fix-nulls.js
          node tools/merge-nav.js
          # 2026-10-29 修：merge-nav 会把「官方当日净值」追加进 data/hist/<id>.json，
          # 而 navperf 已在上面跑过 → 自算指标停在被追加前的末点。
          # 实测 10-28 云端 16 只 AMTD 的 asOf 停在 10-23（净值已 10-26），
          # 与 WorkBuddy 站相比「更新更少」就是这里造成的。追加后必须再算一遍。
          node navperf.js
          # 2026-11-13：首屏涨跌占比单一口径落盘（本周/上周同函数、同分母），两站读同一份，
          # 不再「本站 w1 − 本站手算」各算各的（曾出现 WB 50%/+1 与 GH 49%/-3）。
          node tools/breadth.js || echo "!! 漲跌佔比生成失敗（接口会回退到即时计算）"
          # 2026-10-29 修：merge-nav 只写 hist 文件、不更新 hist-index.json，
          # 云端没有第二个人补索引 → 索引长期落后（10-28 有 25 只：AMTD 16 + 宏利退休精選 9）。
          node tools/hist-index-sync.js
          # 2026-11-13：funds.nav 与 hist 末点统一到 4 位（銀聯信託抓取原值 6-7 位，
          # 两站一个 11.9906 一个 11.9905946，site-diff 会报「同一天数值不同」）。
          node tools/nav-round4.js
          # 2026-11-11（用户反馈两站数据不一致，根因）：云端从未调用过 mpfindex.js，
          # 自算的 MPF 市场/股票/混合/债券指数一直冻结在上一次提交的日期（实测 11-04），
          # 而本机每天两次重算（11-09）→ 两站顶部行情条差 5 天。
          # mpfindex 只读 data/hist + funds + holdings，纯 JS，几十毫秒。
          node mpfindex.js || echo "!! 自算指數失敗（保留舊數據）"
          # 2026-11-11：走势图「未选基金」统计表数据源，必须与最新净值日同步
          node allstats.js || echo "!! 區間統計失敗（保留舊數據）"
          # 2026-10-26：先判定持仓是否退化（退化则整档回滚），再做规范化与守卫——
          # 避免「坏数据已落盘、守卫只告警」的旧问题在云端复现
          if [ "${{ steps.mode.outputs.light }}" = "0" ]; then
            node tools/holdings-txn.js check --restore || echo "!! 檢測到持倉退化，已回滾到抓取前快照"
            node tools/holdings-normalize.js
            node tools/holdings-guard.js --fix   # 2026-11-13：--fix 让 allocIncomplete/allocSum 跟随实际合计落库
          fi
          # 2026-10-28：校验类步骤改为「告警不阻断」——10-28 10:41 的定时任务就是因为
          # 三处一致性巡检返回 1 直接整条 run 失败，连 Pages 都没发布出去。
          # 数据本身有防退化守卫兜底，发布上一次完整数据比「什么都不发」更安全。
          node tools/nav-consistency.js || echo "!! nav-consistency 未通过（不影响发布）"
          # 2026-11-13：按来源的新鲜度闸门（新地 41 天静默停更就是这里没人看）
          node tools/freshness-guard.js || echo "!! 有來源淨值停滯（見 data/freshness.json）"
          # 2026-11-13：区间断档清单（前端「有区间缺日」提示的数据源）
          node tools/hist-gaps-build.js --quiet || echo "!! 斷檔清單生成失敗"
          # 2026-10-26 修 4-05：补齐本机 health-check 覆盖的四类哨兵（缺日/渠道一致/allocSum/三处一致本地版）
          node tools/gap-check.js || echo "!! gap-check 有缺口（不影响发布）"
          # 2026-11-19：与 daily.sh 同因——gap-check 的补抓会把 2 位净值写回 funds（AMTD 经 etnet），
          # 上面 205 行的 nav-round4 已过期；构建前再归一一次，避免 funds/hist 精度不一致。
          node tools/nav-round4.js
          node tools/health-check.js --local || echo "!! health-check 有告警（不影响发布）"
          # 2026-11-23（用户要求：解决不了的必须告诉我）：把本班没自动解决的事汇总，
          # critical 进下面的告警邮件，warn 随邮件附上；同时写 Actions 的 Step Summary。
          node tools/run-issues.js --print || true

      # 2026-11-18（用户要求）：跑完立刻自检新鲜度，落后就发邮件（仅定时/手动数据班次）
      - name: 新鮮度自檢（落後發郵件）
        if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-data]'))
        continue-on-error: true
        env:
          MPF_SMTP_USER: ${{ secrets.MPF_SMTP_USER }}
          MPF_SMTP_PASS: ${{ secrets.MPF_SMTP_PASS }}
          MPF_MAIL_TO: ${{ secrets.MPF_MAIL_TO }}
        run: node tools/freshness-watch.js --mail || true

      - name: 官網快照自檢（雲端必須真的抓到頁面）
        continue-on-error: true
        run: |
          node -e "
          const n=require('./data/nav.json');
          const src=n.sources||[];
          const all=src.length;
          const ok=src.filter(s=>s.count>0).length;
          const carried=src.filter(s=>s.carried).length;
          const alerts=(n.alerts||[]).length;
          const line='官網來源有數據 '+ok+' / '+all+'；沿用上次 '+carried+' 個來源；告警 '+alerts+' 条；nav.updatedAt '+new Date(n.updatedAt).toISOString();
          console.log(line);
          try{ if(process.env.GITHUB_STEP_SUMMARY){require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### 官網快照自檢\n\n'+line+'\n');} }catch(e){}
          if(!ok){ console.error('!! 官網快照 0 條：Chrome 渲染失敗或官網訪問被攔'); process.exit(1); }
          if(carried > all/2){ console.error('!! 超過半數來源沿用舊數據：雲端渲染大面積失敗，GitHub 站淨值不會刷新'); process.exit(1); }
          "

      # 2026-11-16：轻量任务当天无数据变化时不会提交，B 站横幅停在上一班（04:41）。
      # 每次数据任务结束都打时间戳：funds.updatedAt + update-status.json。
      - name: 打時間戳（數據更新時間 / 更新狀態）
        run: |
          if [ "${{ steps.mode.outputs.light }}" = "1" ]; then
            node tools/stamp-run.js "早晨净值更新完成" github
          else
            node tools/stamp-run.js "全量更新完成" github
          fi

      - name: 提交數據變更
        # 2026-10-28：本机每日 23:20 也会推一次数据，云端与本机同时提交同一批文件时 rebase 会冲突，
        # 曾导致整个 run 在「提交」这一步失败（10:41 的定时任务就是这样挂的，站点没发布）。
        # 现在：冲突时以「本次运行抓到的数据」为准继续 rebase；仍失败只告警，不阻断后续构建发布。
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add data/ 2>/dev/null || true
          git add -f data/update-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "數據無變更"
            exit 0
          fi
          git commit -m "daily data update $(date -u +%F) [${{ steps.mode.outputs.mode }}]"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; echo "推送成功（第 $i 次）"; break; fi
            echo "推送被拒（第 $i 次），rebase 后重试…"
            git fetch origin main || true
            if ! git rebase origin/main; then
              # 冲突文件一律采用本次运行抓到的版本（rebase 中 theirs = 本地提交）
              git checkout --theirs -- data 2>/dev/null || true
              git add data 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "!! 数据回写失败（不影响本次站点发布，本机 nightly 仍会推送）"
          fi

  # 2026-11-23（用户要求：两站必须各自独立更新，B 站不能依赖本机 WorkBuddy）：
  # 季度持仓在云端自己跑。到期判定沿用 tools/quarterly-due.js（季末后第 1 个月周日 /
  # 第 2 个月周三+周日 / 第 3 个月周二+周四+周日；完成度 ≥95% 即停，下一季重新计）。
  # tools/quarterly.sh 已改为动态解析解释器（$MPF_PYTHON / $MPF_NODE → PATH → 自动探测），
  # 不再写死任何本机路径；原先被 .gitignore 漏掉的 4 个解析器也已入库。
  quarterly:
    concurrency:
      group: mpf-data
      cancel-in-progress: false
    needs: [update-data]
    # 正常只在全量班后跑；手动 workflow_dispatch 选 quarterly=force、或提交信息带
    # [quarterly-now]（无需 token 的应急入口）时，允许单独跑一次季度链路。
    if: always() && (needs.update-data.outputs.mode == 'full' || github.event.inputs.quarterly == 'force' || contains(github.event.head_commit.message, '[quarterly-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝抓取依賴
        run: |
          python -m pip install --upgrade pip
          pip install 'curl_cffi>=0.16,<0.17' 'PyMuPDF>=1.26,<3' 'pdfplumber>=0.11,<0.12' 'requests>=2.32,<3'

      - name: 確認無頭瀏覽器可用（AMTD 走 Google Drive）
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            (command -v chromium-browser || command -v chromium) && echo "ok"
          fi

      - name: 必需檔案自檢（防止核心腳本被 .gitignore 漏掉）
        run: |
          miss=0
          for f in tools/quarterly.sh tools/quarterly-due.js tools/source-due.js tools/holdings-txn.js \
                   tools/holdings-normalize.js tools/holdings-guard.js \
                   bea_holdings.py bea_alloc_ingest.py tools/replace-mpfhk-hsbc2.py \
                   tools/parse-fidelity-ffs.py fetch-manulife-detail.py alloc_fill.py \
                   bct_ffs_auto.py bct_ffs2.py bct_holdings.py sunlife_holdings.py \
                   tools/fetch-chinalife-fpr.py chinalife_holdings.py \
                   tools/amtd-fetch-chrome.js tools/parse-amtd-ffs.py; do
            [ -f "$f" ] || { echo "!! 缺少必需文件：$f"; miss=1; }
          done
          [ "$miss" = "0" ] || exit 1
          echo "季度链路脚本齐全"

      - name: 到期判定（季末后按月递增频率，≥95% 即停）
        id: due
        run: |
          if [ "${{ github.event.inputs.quarterly }}" = "force" ] || git log -1 --pretty=%B | grep -q '\[quarterly-now\]'; then
            echo "手动指定 force / 提交带 [quarterly-now]，强制跑一次"
            echo "due=1" >> "$GITHUB_OUTPUT"
          elif node tools/quarterly-due.js --why; then
            echo "due=1" >> "$GITHUB_OUTPUT"
          else
            echo "due=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 刷新季度持倉（含逐只事务护栏）
        if: steps.due.outputs.due == '1'
        run: |
          # 硬超时 60 分钟：最慢的是 AMTD（16 只逐只过 Chrome 下载 Google Drive）
          timeout 3600 bash tools/quarterly.sh || echo "!! 季度链路有步骤失败（明细见 data/holdings-update.log）"
          node -e "
            const h=require('./data/holdings.json');
            const ids=Object.keys(h.funds||{});
            const a=ids.map(i=>h.funds[i]&&h.funds[i].asOf).filter(Boolean).sort();
            console.log('holdings 条目 '+ids.length+'；asOf 中位 '+(a[Math.floor(a.length/2)]||'无')+'；最新 '+(a[a.length-1]||'无'));
          "

      - name: 提交季度數據
        if: steps.due.outputs.due == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "季度數據無變更"
            exit 0
          fi
          git commit -m "quarterly holdings update $(date -u +%F)"
          ok=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then ok=1; echo "推送成功（第 $i 次）"; break; fi
            echo "推送被拒（第 $i 次），rebase 后重试…"
            git fetch origin main || true
            if ! git rebase origin/main; then
              git checkout --theirs -- data 2>/dev/null || true
              git add data 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "!! 季度數據回寫失敗（不影響本次站點發布，明晚全量班會再補）"
          fi

  build-deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [update-data, quarterly]
    # 即使数据班/季度班失败也照常发布「已提交的 main」——发布上一次完整数据，
    # 比整站停在旧版本更安全（10-28 就因为校验步骤返回 1 把 Pages 卡死过一次）。
    if: always() && !cancelled()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2026-11-17（用户要求）：无论成功失败都要写终态，否则站点会永远显示「更新进行中」。
      - name: 收尾寫入終態（always）
        if: always()
        continue-on-error: true
        run: |
          node -e '
            const fs=require("fs");
            const p="data/update-status.json";
            let j={};
            try{j=JSON.parse(fs.readFileSync(p,"utf8"))}catch(e){}
            if(j.phase==="running"){
              j.phase=process.env.MPF_JOB_OK==="1"?"done":"error";
              j.finishedAt=new Date(Date.now()+8*3600e3).toISOString().slice(11,16);
              fs.writeFileSync(p,JSON.stringify(j));
              console.log("已写终态:", j.phase);
            }
          '
        env:
          MPF_JOB_OK: ${{ job.status == 'success' && '1' || '0' }}

      - name: 必需檔案自檢（防止核心腳本被 .gitignore 漏掉）
        # 2026-11-12（核驗發現）：mpfindex.js 一直在 .gitignore 裡，雲端 `node mpfindex.js`
        # 每次都是 MODULE_NOT_FOUND，被後面的 `|| echo` 吞掉 → 自算指數的最後一個點
        # 永遠停在本機某次快照推上來的舊值（兩站 ticker 差 0.02–0.17%，且永不收斂）。
        # 這裡先自檢：缺任何一個必需文件就直接失敗，不讓「靜默沿用舊數據」再發生。
        run: |
          miss=0
          for f in mpfindex.js indexbuild.js navperf.js allstats.js server.js scraper.js \
                   tools/build-static.js tools/mpfa-refresh.js tools/hist-index-sync.js \
                   tools/merge-nav.js tools/fix-nulls.js public/index.html public/home.html \
                   tools/quarterly.sh tools/quarterly-due.js fetch-manulife-detail.py \
                   alloc_fill.py bct_ffs2.py bct_holdings.py; do
            [ -f "$f" ] || { echo "!! 缺少必需文件：$f"; miss=1; }
          done
          [ "$miss" = "0" ] || exit 1
          echo "必需文件齊全"

      # 2026-11-13：只有 schedule / [run-data] 才会跑上面的抓取段，push 触发的构建
      # 只走这个 job。所以凡是「数据归一」类步骤必须放在这里，否则两种触发方式
      # 会产出不同格式的数据（funds.nav 7 位 vs 4 位，site-diff 每轮都报 52 只不一致）。
      - name: 淨值精度歸一（與 hist 末點對齊，4 位）
        run: node tools/nav-round4.js
      # 2026-11-14（第三轮独立核验 D-02）：push 触发的构建只跑本 job，原先只有
      # nav-round4/mpfindex 两个归一步骤 → 一旦有人直接提交 hist/funds 的修改，
      # 静态站会用旧的派生数据（nav-perf / hist-index / allstats / hist-gaps）。
      # 下列 4 步只读本地文件、结果确定、不联网、不改原始数据，因此两个 job 都跑。
      # 仍只在抓取 job 跑的 4 个，理由不同：
      #   indexbuild.js           需要联网取外部行情，放构建 job 会让 push 构建受网络影响；
      #   merge-nav/fix-nulls/holdings-normalize  会改写 funds/holdings 原始数据，
      #                           不应在「发布构建」里静默改数据（须经抓取 job 校验后提交）。
      - name: 歷史索引對齊（由 hist 檔案重算 hist-index）
        run: node tools/hist-index-sync.js
      - name: 派生指標重算（navperf / allstats）
        run: |
          node navperf.js
          node allstats.js
      - name: 斷檔清單重算（hist-gaps）
        run: node tools/hist-gaps-build.js
      # 2026-11-13（第三轮自检发现）：breadth 原先只挂在抓取 job，
      # push 触发的构建不重算 → 一旦有人改 hist/nav-perf，首屏占比会与数据脱节。
      - name: 首屏漲跌佔比（單一口徑）
        run: node tools/breadth.js || echo "!! 漲跌佔比失敗（接口回退即時計算）"

      - name: 重算自算指數（每次構建都用当前 hist 重算，避免任何触发方式留下舊值）
        run: |
          node mpfindex.js || echo "!! 自算指數失敗（沿用倉庫數據）"

      # 2026-11-22（用户要求）：两站各自独立，不互推数据；这里只做「只读核验」，
      # 结果写 data/cross-check.json（页脚「核对」第二行读取）。需要 secret MPF_SHARE 才能读 A 站，
      # 没有 secret 时脚本自行跳过，不影响构建。
      - name: 兩站交叉核驗（只讀）
        env:
          MPF_SHARE: ${{ secrets.MPF_SHARE }}
        run: node tools/cross-check.js || true

      - name: 靜態化構建
        run: node tools/build-static.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 2026-11-21（用户要求）：GitHub Pages 偶发部署失败（deploy-pages@v4），
      # 失败后等 30 秒自动重试一次——这类失败重试基本都能过。
      - id: pages1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 等待 30 秒后重试 Pages 部署
        if: steps.pages1.outcome == 'failure'
        run: sleep 30

      - name: 重试 Pages 部署
        if: steps.pages1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # 2026-11-17（用户要求）：数据任务失败/被跳过 → 直接发邮件，不再等人发现。
  # 依赖 Secrets：MPF_SMTP_USER / MPF_SMTP_PASS / MPF_MAIL_TO（已在仓库设置）。
  notify-failure:
    needs: [update-data, quarterly, build-deploy]
    # 2026-11-23：job 级不再写死 cron 判断（那是第二份「事实来源」，11-21 就是这么坏的）。
    # 先算「本次是不是全量/手动班」，再决定发不发信：早班（轻量）失败不打扰，
    # 数据可等当晚全量班补齐。
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 判定是否需要发信
        id: cls
        env:
          EV_NAME: ${{ github.event_name }}
          EV_SCHED: ${{ github.event.schedule }}
        run: |
          FULL_CRON=$(grep -oE "cron: *'[^']+' *# *full" .github/workflows/deploy.yml | head -1 | sed -E "s/^.*cron: *'([^']+)'.*/\1/" || true)
          if [ "$EV_NAME" != "schedule" ] || [ "$EV_SCHED" = "$FULL_CRON" ]; then
            echo "send=1" >> "$GITHUB_OUTPUT"
          else
            echo "send=0" >> "$GITHUB_OUTPUT"
            echo "轻量班失败，不发邮件（等今晚全量班补齐）"
          fi
      - uses: actions/setup-node@v4
        if: steps.cls.outputs.send == '1'
        with:
          node-version: '20'
      - name: 发送失败告警
        if: steps.cls.outputs.send == '1'
        env:
          MPF_SMTP_USER: ${{ secrets.MPF_SMTP_USER }}
          MPF_SMTP_PASS: ${{ secrets.MPF_SMTP_PASS }}
          MPF_MAIL_TO: ${{ secrets.MPF_MAIL_TO }}
        run: |
          node tools/notify-mail.js \
            --subject "[强积金] 云端更新失败 · $(date -u +%m-%d\ %H:%M)Z" \
            --body "工作流 deploy 失败
          时间（UTC）：$(date -u +%F\ %T)
          触发方式：${{ github.event_name }}
          提交：${{ github.sha }}
          查看：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
